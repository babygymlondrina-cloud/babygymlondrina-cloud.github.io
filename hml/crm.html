          const agendamentos = _agendamentosDo(lead, bebe.nome);
          const ultimo = agendamentos[0] || {};
          const href = LinkBuilder.proposta({
            mae: (lead.responsavel && lead.responsavel.nome) || lead.nomeWhatsApp,
            filho: bebe.nome,
            sexo: bebe.sexo,
            turma: ultimo.turma,
            pePaga:
              !!ultimo.pagamentoPE && ultimo.pagamentoPE.status === BGL_CONST.CRM.PAGAMENTO_PE.PAGO,
            // `lead.telefone` é `null` no lead que só resolve por chatID
            // (LID do WhatsApp/Instagram/Telegram) — nesse caso o docId
            // (`resposta.id`, sempre o telefone OU o chatID) é o melhor
            // valor que dá pra pré-preencher no proposta.html.
            telefone: lead.telefone || telefoneFallback,
            leadId: telefoneFallback,
          });
          return (
            '<div class="bebe-card">' +
            '<div class="bebe-nome">' +
            (emojiSexo(bebe.sexo) ? emojiSexo(bebe.sexo) + ' ' : '') +
            esc(ou(bebe.nome, 'Bebê sem nome')) +
            '</div>' +
            '<div class="item-sub">' +
            esc(ou(bebe.nascimento, 'nascimento não informado')) +
            ' · ' +
            esc(ou(bebe.sexo, 'sexo não informado')) +
            (bebe.prematuro ? ' · prematuro' : '') +
            (bebe.alergia ? ' · alergia: ' + esc(bebe.alergia) : '') +
            '</div>' +
            '<div class="acoes">' +
            '<a class="btn-acao" data-proposta href="' +
            esc(href) +
            '" target="_blank" rel="noopener">📄 Gerar proposta</a>' +
            '</div>' +
            '</div>'
          );
        }

        function _agendamento(a) {
          return (
            '<tr>' +
            '<td>' +
            esc(dataCurta(a.data)) +
            '</td>' +
            '<td>' +
            esc(ou(a.hora)) +
            '</td>' +
            '<td>' +
            esc(ou(a.bebe)) +
            '</td>' +
            '<td>' +
            esc(ou(a.turma)) +
            '</td>' +
            '<td>' +
            esc(ou(a.status)) +
            '</td>' +
            '<td>' +
            badgeConfirmacao(a.confirmacao && a.confirmacao.status) +
            '</td>' +
            '<td>' +
            badgePagamentoPE(a.pagamentoPE && a.pagamentoPE.status) +
            '</td>' +
            '<td>' +
            (a.compareceu ? badge('Compareceu', 'ok') : '') +
            (a.fechou ? badge('Fechou', 'ok') : '') +
            '</td>' +
            '</tr>'
          );
        }

        function render(resposta) {
          const lead = (resposta && resposta.lead) || {};
          const wpp = LinkBuilder.conversa(lead.telefone || resposta.id);
          const bebes = lead.bebes || [];
          const agendamentos = (lead.agendamentos || [])
            .slice()
            .sort((a, b) =>
              String((b.data || '') + ' ' + (b.hora || '')).localeCompare(
                String((a.data || '') + ' ' + (a.hora || '')),
              ),
            );

          return (
            '<dl>' +
            _campo(
              'Responsável',
              ou((lead.responsavel && lead.responsavel.nome) || lead.nomeWhatsApp),
            ) +
            _campo('Telefone', ou(lead.telefone || resposta.id)) +
            _campo('E-mail', ou(lead.responsavel && lead.responsavel.email)) +
            _campo('Canal', ou(lead.canal)) +
            _campo('Como conheceu', ou(lead.comoConheceu)) +
            _campo('Primeiro contato', ou(lead.primeiroContatoEm)) +
            _campoHtml(
              'Recuperação',
              (lead.recuperacao && lead.recuperacao.travado ? badge('Travado', 'warn') : '') +
                (lead.recuperacao && lead.recuperacao.reengajavel === false
                  ? badge('Não reengajável', 'neutro')
                  : badge('Reengajável', 'ok')),
            ) +
            '</dl>' +
            (wpp
              ? '<div class="acoes"><a class="btn-acao" href="' +
                esc(wpp) +
                '" target="_blank" rel="noopener">💬 Abrir conversa</a></div>'
              : '') +
            '<h3 class="secao-titulo">Bebês (' +
            bebes.length +
            ')</h3>' +
            (bebes.length
              ? bebes.map((b) => _bebe(lead, b, resposta.id)).join('')
              : '<div class="vazio">Nenhum bebê cadastrado.</div>') +
            '<h3 class="secao-titulo">Agendamentos (' +
            agendamentos.length +
            ')</h3>' +
            (agendamentos.length
              ? '<div class="tabela-wrap"><table><thead><tr>' +
                '<th>Data</th><th>Hora</th><th>Bebê</th><th>Turma</th><th>Status</th>' +
                '<th>Confirmação</th><th>PE</th><th></th>' +
                '</tr></thead><tbody>' +
                agendamentos.map(_agendamento).join('') +
                '</tbody></table></div>'
              : '<div class="vazio">Nenhum agendamento — este lead nunca agendou.</div>') +
            _propostas()
          );
        }

        /**
         * Propostas geradas para este lead (issue #296) — é aqui que a equipe
         * pergunta "já mandaram proposta para essa mãe?".
         *
         * Só aparecem as propostas com `leadId`, ou seja, as geradas pelo botão
         * daqui depois desta versão. Proposta antiga, e proposta aberta direto
         * no `proposta.html` sem vir do CRM, não tem elo e não entra: lista
         * vazia aqui não quer dizer que ninguém mandou proposta.
         */
        function _propostas() {
          const itens = CrmState.lead.getPropostas();
          const erro = CrmState.lead.getPropostasErro();
          const titulo =
            '<h3 class="secao-titulo">Propostas' +
            (itens ? ' (' + itens.length + ')' : '') +
            '</h3>';
          if (erro) return titulo + '<div class="vazio">' + esc(erro) + '</div>';
          if (!itens) return titulo + '<div class="vazio">Carregando…</div>';
          if (!itens.length) {
            return (
              titulo +
              '<div class="vazio">Nenhuma proposta registrada — as geradas antes desta ' +
              'versão não aparecem aqui.</div>'
            );
          }
          return (
            titulo +
            '<div class="tabela-wrap"><table><thead><tr>' +
            '<th>Gerada em</th><th>Bebê</th><th>Operador</th><th>Validade</th><th></th>' +
            '</tr></thead><tbody>' +
            itens.map(_proposta).join('') +
            '</tbody></table></div>'
          );
        }

        function _proposta(p) {
          return (
            '<tr>' +
            '<td>' +
            esc(dataHoraBr(p.criadoEm, p.criadoEmHora)) +
            '</td>' +
            '<td>' +
            esc(ou(p.filho)) +
            '</td>' +
            '<td>' +
            esc(ou(p.operatorEmail)) +
            '</td>' +
            '<td>' +
            esc(dataHoraBr(p.linkExp)) +
            '</td>' +
            '<td>' +
            (linkSeguro(p.linkUrl)
              ? '<a class="btn-acao" data-proposta-link href="' +
                esc(p.linkUrl) +
                '" target="_blank" rel="noopener">🔗 Abrir</a>'
              : '') +
            '</td>' +
            '</tr>'
          );
        }

        return { render };
      })();

      // ─── UIRenderer ──────────────────────────────────────────────────────
      // Fachada: escolhe o sub-renderer da aba ativa e desenha a barra de
      // status. Mesmo padrão do `UIRenderer` do planos.html.
      const UIRenderer = (function () {
        const ABAS = [
          { id: ABA.PAINEL, rotulo: '📌 Painel do Dia' },
          { id: ABA.SEMANA, rotulo: '🗓️ Semana' },
          { id: ABA.MES, rotulo: '📅 Mês' },
          { id: ABA.FRIOS, rotulo: '❄️ Frios' },
          { id: ABA.BUSCA, rotulo: '🔎 Buscar' },
        ];
        // Hora cheia usada no último desenho do painel — o tique só redesenha
        // quando ela muda, para não sacudir a tela a cada minuto à toa.
        let _horaDesenhada = null;

        function renderTabs() {
          const nav = document.getElementById('tabs');
          nav.innerHTML = ABAS.map(
            (a) =>
              '<button class="tab" role="tab" data-aba="' +
              a.id +
              '" aria-selected="false">' +
              esc(a.rotulo) +
              '</button>',
          ).join('');
        }

        function _status() {
          if (CrmState.ui.isCarregando()) return 'Buscando na API…';
          const em = CrmState.ui.getAtualizadoEm();
          if (!em) return '';
          const hora = new Intl.DateTimeFormat('pt-BR', {
            timeZone: BGL_CONST.TZ,
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23',
          }).format(new Date(em));
          const sufixo =
            CrmState.ui.getAba() === ABA.PAINEL ? ' · agora são ' + Relogio.horaAgora() : '';
          return 'Atualizado às ' + hora + sufixo;
        }

        function render() {
          const aba = CrmState.ui.getAba();
          document.querySelectorAll('#tabs .tab').forEach((b) => {
            b.setAttribute('aria-selected', String(b.dataset.aba === aba));
          });
          document.getElementById('status-linha').textContent = _status();

          const erro = CrmState.ui.getErro();
          const avisoAcao = CrmState.ui.getAvisoAcao();
          const dados = CrmState.dados.get(aba);
          let html = '';
          if (erro) {
            html = '<div class="aviso aviso-erro" id="erro-tela">' + esc(erro.mensagem) + '</div>';
          }
          if (avisoAcao) {
            html += '<div class="aviso aviso-info" id="aviso-espelho">' + esc(avisoAcao) + '</div>';
          }
          if (aba === ABA.BUSCA) {
            html = BuscaRenderer.render();
          } else if (dados) {
            const sub =
              aba === ABA.PAINEL
                ? PainelRenderer
                : aba === ABA.SEMANA
                  ? SemanaRenderer
                  : aba === ABA.MES
                    ? MesRenderer
                    : FriosRenderer;
            html += sub.render(dados);
          } else if (!erro) {
            html = '<div class="vazio">Carregando…</div>';
          }
          document.getElementById('conteudo').innerHTML = html;
          _horaDesenhada = Relogio.horaCorrente();
        }

        /**
         * Tique do relógio: redesenha o Painel do Dia quando a hora cheia muda,
         * SEM chamar a API. É o que faz o bloco das 14h virar "agora" às 14:00
         * e "já passou" às 15:00 (decisão D8, item b).
         */
        function talvezRedesenharPeloRelogio() {
          if (CrmState.ui.getAba() !== ABA.PAINEL) return;
          if (Relogio.horaCorrente() === _horaDesenhada) return;
          render();
        }

        /**
         * Leva a aba Semana para o dia de HOJE (issue #257) — ela mostra
         * `hoje-7..hoje+7` desde a #244, e sem isso abre no dia mais antigo da
         * janela, com hoje abaixo da dobra.
         *
         * NÃO é chamada por `render()`, de propósito: `render()` roda no
         * polling de 5 min, ao recuperar o foco, no botão Atualizar e depois de
         * cada clique de escrita (atualização otimista). Ancorar ali faria a
         * página pular de volta para hoje no meio da leitura de um dia
         * passado. Quem chama é `CrmController`, uma vez por ENTRADA na aba.
         *
         * O alvo é o primeiro dia `>= hoje`, não o dia de hoje: dia sem
         * agendamento não gera grupo, então hoje pode não estar na página.
         * Janela só com passado (nenhum dia `>= hoje`) ancora no último grupo,
         * que é o mais recente.
         *
         * A altura do cabeçalho fixo é MEDIDA, não constante: o `.crm-topo` é
         * `position: sticky` e pode quebrar em duas linhas em tela estreita —
         * uma constante duplicada aqui sairia de sincronia com o CSS.
         */
        function ancorarHojeNaSemana() {
          const grupos = document.querySelectorAll('#conteudo .dia-grupo');
          if (!grupos.length) return;
          const hoje = Relogio.hojeISO();
          const alvo =
            Array.from(grupos).find((g) => g.dataset.dia >= hoje) || grupos[grupos.length - 1];
          const topo = document.querySelector('.crm-topo');
          const alturaTopo = topo ? topo.getBoundingClientRect().height : 0;
          // A folga não é respiro: é a ESPIADA que serve de affordance. Com
          // folga mínima o título de hoje cola no cabeçalho e nada na tela diz
          // que existe passado acima — a rolagem vertical não se anuncia
          // sozinha. Deixando a borda do grupo anterior aparecendo, a própria
          // lista informa que dá para subir, sem rótulo novo numa tela que já
          // tem cinco abas e quatro botões por linha.
          const ESPIADA = 28;
          const y = alvo.getBoundingClientRect().top + window.scrollY - alturaTopo - ESPIADA;
          // Instantâneo, não `smooth`: a aba acabou de abrir, então animar a
          // partir de uma posição que ninguém viu é movimento sem informação.
          window.scrollTo({ top: Math.max(0, y) });
        }

        function renderLead() {
          const modal = document.getElementById('lead-modal');
          const doc = CrmState.lead.getDoc();
          if (!doc) {
            modal.style.display = 'none';
            return;
          }
          document.getElementById('lead-modal-titulo').textContent =
            (doc.lead && doc.lead.responsavel && doc.lead.responsavel.nome) ||
            (doc.lead && doc.lead.nomeWhatsApp) ||
            doc.id;
          document.getElementById('lead-modal-body').innerHTML = LeadDetailRenderer.render(doc);
          modal.style.display = 'flex';
        }

        return {
          renderTabs,
          render,
          renderLead,
          talvezRedesenharPeloRelogio,
          ancorarHojeNaSemana,
        };
      })();

      // ─── Atualizador ─────────────────────────────────────────────────────
      // Política de refetch da decisão D8 (item c), na ordem de importância que
      // ela declara — a tela fica aberta o dia inteiro e cada busca varre a
      // coleção (~2,5k docs), então aba parada não pode gastar leitura:
      //   1. NÃO busca em aba oculta (Page Visibility API) — o maior corte;
      //   2. busca ao voltar o foco para a aba;
      //   3. polling de 5 minutos enquanto visível;
      //   4. botão "Atualizar" manual.
      const Atualizador = (function () {
        const POLL_MS = 5 * 60 * 1000;
        const TIQUE_MS = 30 * 1000;
        // Janela curta que evita busca dupla quando `visibilitychange` e
        // `focus` disparam juntos (voltar para a aba dispara os dois).
        const DEBOUNCE_MS = 2000;
        let _ultimaBusca = 0;

        function visivel() {
          return document.visibilityState !== 'hidden';
        }

        function marcarBusca() {
          _ultimaBusca = Date.now();
        }

        function _tique() {
          UIRenderer.talvezRedesenharPeloRelogio();
          if (!visivel()) return;
          // Passou da meia-noite com a tela aberta: a janela do painel é de
          // ontem. Busca já, sem esperar os 5 minutos.
          if (CrmController.janelaVencida()) return CrmController.buscar();
          if (Date.now() - _ultimaBusca >= POLL_MS) CrmController.buscar();
        }

        function aoRecuperarFoco() {
          if (!visivel()) return;
          if (CrmState.ui.isCarregando()) return;
          if (Date.now() - _ultimaBusca < DEBOUNCE_MS) return;
          CrmController.buscar();
        }

        function iniciar() {
          setInterval(_tique, TIQUE_MS);
          document.addEventListener('visibilitychange', aoRecuperarFoco);
          window.addEventListener('focus', aoRecuperarFoco);
        }

        return { iniciar, marcarBusca, visivel };
      })();

      // ─── CrmController ───────────────────────────────────────────────────
      // Orquestra aba ativa, janela de datas, busca de dados e abertura do
      // detalhe do lead. Não desenha nada e não fala com a rede direto — quem
      // desenha é o `UIRenderer`, quem busca é o `ApiClient`.
      const CrmController = (function () {
        /**
         * Entrada na aba Semana pendente de âncora (issue #257). Consumido uma
         * vez, no fim do `buscar()` — é o que garante que polling, foco,
         * Atualizar e escrita otimista NÃO re-ancorem a página.
         */
        let _ancorarSemana = false;

        /** Sequência das buscas de proposta — ver `carregarPropostas`. */
        let _propostasToken = 0;

        /** Mês navegado da aba Mês, resolvendo o default (mês corrente) na 1ª leitura. */
        function mesReferenciaAtual() {
          return CrmState.ui.getMesReferencia() || Relogio.mesAtual();
        }

        /** Janela `{ de, ate }` da aba, em `YYYY-MM-DD` na timezone da unidade. */
        function janelaDaAba(aba) {
          const hoje = Relogio.hojeISO();
          // Painel do Dia: só hoje. Semana: hoje-7..hoje+7 (issue #244) — os
          // 7 pra trás são para contato/acompanhamento, os 7 pra frente são a
          // mesma janela da mensagem das 18h. Mês: o mês navegado inteiro
          // (cabe no teto de 31 dias da API).
          if (aba === ABA.SEMANA) {
            return { de: Relogio.somaDias(hoje, -7), ate: Relogio.somaDias(hoje, 7) };
          }
          if (aba === ABA.MES) return Relogio.janelaDoMes(mesReferenciaAtual());
          return { de: hoje, ate: hoje };
        }

        /**
         * A janela já carregada envelheceu (a tela passou da meia-noite aberta)?
         * Só se aplica a abas ancoradas em "hoje" — a Mês é ancorada no mês
         * NAVEGADO, que pode nem ser o corrente.
         */
        function janelaVencida() {
          const aba = CrmState.ui.getAba();
          if (aba === ABA.BUSCA || aba === ABA.FRIOS || aba === ABA.MES) return false;
          const dados = CrmState.dados.get(aba);
          if (!dados || !dados.janela) return false;
          return dados.janela.de !== janelaDaAba(aba).de;
        }

        async function buscar() {
          const aba = CrmState.ui.getAba();
          if (aba === ABA.BUSCA) return; // a aba de busca só responde a submit
          Atualizador.marcarBusca();
          CrmState.ui.setCarregando(true);
          CrmState.ui.setErro(null);
          UIRenderer.render();
          try {
            const params =
              aba === ABA.FRIOS ? { view: VIEW.FRIOS } : { view: VIEW.AGENDA, ...janelaDaAba(aba) };
            CrmState.dados.set(aba, await ApiClient.get('/leads', params));
            CrmState.ui.setAtualizadoEm(Date.now());
          } catch (e) {
            _tratarErro(e);
          } finally {
            CrmState.ui.setCarregando(false);
            UIRenderer.render();
            // `aba` é a busca QUE ESTÁ TERMINANDO, não a aba de agora: sem
            // essa checagem, o `finally` de uma busca de OUTRA aba consome a
            // flag. Acontece sem clique acrobático — a tela abre no Painel e
            // já busca; quem clica na Semana antes dessa 1ª resposta voltar
            // faz o `finally` do Painel zerar a flag com o DOM da Semana ainda
            // vazio, e quando o dado da Semana chega não sobra ninguém para
            // ancorar (achado 1 da revisão da PR #256).
            if (_ancorarSemana && aba === ABA.SEMANA) {
              _ancorarSemana = false;
              // A aba ainda pode ter mudado durante o request.
              if (CrmState.ui.getAba() === ABA.SEMANA) UIRenderer.ancorarHojeNaSemana();
            }
          }
        }

        function _tratarErro(e) {
          if (e.sessaoExpirada) {
            AuthController.expirar(e.message);
            return;
          }
          CrmState.ui.setErro({ mensagem: e.amigavel ? e.message : 'Erro inesperado na tela.' });
          if (!e.amigavel) console.error('[CRM]', e);
        }

        function irPara(aba) {
          if (aba === CrmState.ui.getAba()) return;
          // Só a ENTRADA na aba ancora (issue #257) — ver `_ancorarSemana`.
          if (aba === ABA.SEMANA) _ancorarSemana = true;
          CrmState.ui.setAba(aba);
          CrmState.ui.setErro(null);
          CrmState.ui.setAvisoAcao(null);
          UIRenderer.render();
          // RE-entrada com cache: `CrmState.dados` sobrevive à troca de aba,
          // então a lista já aparece desenhada — e no topo, ou seja, no dia
          // mais antigo. Esperar a resposta para ancorar deixaria um piscar do
          // dia errado com a duração da latência (achado 4 da revisão da PR
          // #256). Sem cache não há grupo no DOM e a função sai sozinha; a
          // âncora pós-busca continua valendo, para reposicionar quando o dado
          // novo mudar a altura dos grupos.
          if (aba === ABA.SEMANA) UIRenderer.ancorarHojeNaSemana();
          // Troca de aba REFAZ a chamada com a janela certa — o dado de cada
          // aba tem validade própria, e a Semana não serve para o Painel.
          buscar();
        }

        /**
         * ◀/▶ da aba Mês: muda o mês navegado e refaz a chamada (janela nova).
         * Descarta o cache da aba ANTES de redesenhar — sem isso, `render()`
         * usa o mês novo no cabeçalho (`CrmState.ui.getMesReferencia()`) mas
         * os itens do mês ANTERIOR (`CrmState.dados.get(ABA.MES)`, que só
         * `buscar()` substitui, depois de resolver): cabeçalho e lista ficam
         * incoerentes até a resposta chegar (achado da revisão da PR #240).
         */
        function navegarMes(delta) {
          CrmState.ui.setMesReferencia(Relogio.mesSoma(mesReferenciaAtual(), delta));
          CrmState.dados.set(ABA.MES, null);
          UIRenderer.render();
          buscar();
        }

        /** Chip de filtro da aba Mês: liga/desliga, combinável (AND), client-side. */
        function alternarFiltroMes(id) {
          CrmState.ui.toggleMesFiltro(id);
          UIRenderer.render();
        }

        /**
         * Busca única (issue #227): `?view=busca&q=`. O mínimo de caracteres é
         * checado aqui ANTES de chamar a API — evita um 400 previsível a cada
         * tecla e a mensagem sai do cliente, não de um erro de rede.
         */
        async function pesquisar(qBruto) {
          const q = (qBruto || '').trim();
          CrmState.busca.setQuery(q);
          if (q.length < BGL_CONST.CRM.MIN_CARACTERES_BUSCA) {
            CrmState.busca.setResultados(null);
            CrmState.busca.setErro(
              'Digite ao menos ' + BGL_CONST.CRM.MIN_CARACTERES_BUSCA + ' caracteres.',
            );
            UIRenderer.render();
            return;
          }
          CrmState.busca.setCarregando(true);
          CrmState.busca.setErro(null);
          UIRenderer.render();
          try {
            const resposta = await ApiClient.get('/leads', { view: VIEW.BUSCA, q });
            CrmState.busca.setResultados(resposta.itens || []);
          } catch (e) {
            if (e.sessaoExpirada) {
              AuthController.expirar(e.message);
              return;
            }
            CrmState.busca.setResultados(null);
            CrmState.busca.setErro(e.amigavel ? e.message : 'Erro inesperado na busca.');
          } finally {
            CrmState.busca.setCarregando(false);
            UIRenderer.render();
          }
        }

        function atualizarAgora() {
          if (CrmState.ui.getAba() === ABA.BUSCA) return;
          buscar();
        }

        async function abrirLead(telefone) {
          CrmState.lead.set({ carregando: true });
          UIRenderer.render();
          try {
            const doc = await ApiClient.get('/leads/' + encodeURIComponent(telefone));
            CrmState.lead.set({ doc });
          } catch (e) {
            if (e.sessaoExpirada) {
              CrmState.lead.limpar();
              AuthController.expirar(e.message);
              return;
            }
            CrmState.lead.set({
              erro: {
                naoEncontrado: !!e.naoEncontrado,
                mensagem: e.naoEncontrado
                  ? 'Nenhum lead com esse telefone. Confira o número — ou ele ainda não existe no CRM.'
                  : e.amigavel
                    ? e.message
                    : 'Erro inesperado na busca.',
              },
            });
          }
          UIRenderer.render();
          UIRenderer.renderLead();
          // Propostas DEPOIS de desenhar o detalhe, e sem `await` no caminho
          // acima: o que a equipe veio ver é o lead, e ele não espera por uma
          // lista acessória. A seção desenha "carregando" e se completa sozinha.
          //
          // Só quando o lead existe: no 404 (telefone digitado errado, o erro
          // mais comum daqui) o `renderLead` sai cedo por `!getDoc()` e a
          // resposta não teria onde ser desenhada — seria round-trip jogado fora
          // justamente no caminho de erro.
          if (CrmState.lead.getDoc()) carregarPropostas(telefone);
        }

        /**
         * Busca as propostas do lead (issue #296). Falha aqui NUNCA derruba o
         * detalhe — mesma convenção do espelho e do WhatsApp no `PATCH`: o
         * acessório avisa, não quebra. Sessão expirada é a exceção e sobe,
         * porque aí o problema não é acessório nenhum.
         */
        async function carregarPropostas(telefone) {
          // Abrir o lead A e logo o B deixa as duas buscas no ar. Sem isto, a
          // resposta de A chegando por último escreveria as propostas de A no
          // modal de B — o token descarta toda resposta que não seja da ÚLTIMA
          // abertura.
          const token = ++_propostasToken;
          let resultado;
          try {
            const resposta = await ApiClient.get(
              '/leads/' + encodeURIComponent(telefone) + '/propostas',
            );
            resultado = { itens: resposta.propostas || [] };
          } catch (e) {
            if (e.sessaoExpirada) {
              CrmState.lead.limpar();
              AuthController.expirar(e.message);
              return;
            }
            resultado = { erro: 'Não deu para carregar as propostas deste lead agora.' };
          }
          if (token !== _propostasToken) return;
          CrmState.lead.setPropostas(resultado);
          // Só redesenha se o modal ainda estiver aberto: a equipe pode ter
          // fechado enquanto a busca corria.
          if (CrmState.lead.getDoc()) UIRenderer.renderLead();
        }

        function fecharLead() {
          CrmState.lead.limpar();
          UIRenderer.renderLead();
          UIRenderer.render();
        }

        function iniciar() {
          UIRenderer.renderTabs();
          document.getElementById('tabs').addEventListener('click', (e) => {
            const botao = e.target.closest('[data-aba]');
            if (botao) irPara(botao.dataset.aba);
          });
          // Delegação em vez de `onclick` no HTML gerado: nome de lead vem da
          // API e não tem por que virar código.
          document.getElementById('conteudo').addEventListener('click', (e) => {
            // Botões de escrita (T6) primeiro: `[data-acao]` nunca carrega
            // `data-lead` junto, mas checar antes evita qualquer ambiguidade.
            const botaoAcao = e.target.closest('[data-acao]');
            if (botaoAcao) {
              AcoesController.aoClicar(botaoAcao);
              return;
            }
            const navMes = e.target.closest('[data-mes-nav]');
            if (navMes) {
              navegarMes(navMes.dataset.mesNav === 'anterior' ? -1 : 1);
              return;
            }
            const filtroMes = e.target.closest('[data-mes-filtro]');
            if (filtroMes) {
              alternarFiltroMes(filtroMes.dataset.mesFiltro);
              return;
            }
            const alvo = e.target.closest('[data-lead]');
            if (alvo) abrirLead(alvo.dataset.lead);
          });
          document.getElementById('conteudo').addEventListener('submit', (e) => {
            if (e.target.id !== 'form-busca') return;
            e.preventDefault();
            pesquisar(e.target.elements.q.value);
          });
          document.getElementById('btn-atualizar').addEventListener('click', atualizarAgora);
          document.getElementById('btn-fechar-lead').addEventListener('click', fecharLead);
          document.getElementById('lead-modal').addEventListener('click', (e) => {
            if (e.target.id === 'lead-modal') fecharLead();
          });

          UIRenderer.render();
          buscar();
          Atualizador.iniciar();
        }

        return { iniciar, irPara, buscar, atualizarAgora, abrirLead, fecharLead, janelaVencida };
      })();

      // ─── AuthController ──────────────────────────────────────────────────
      // Login Google idêntico ao do proposta.html: mesma allowlist
      // (`BGL_CONFIG.allowedEmails`) e MESMA sessão — as duas páginas dividem a
      // chave de `localStorage` via `AuthSession` (shared.js), então quem entra
      // numa já entra na outra. Sem login não se vê nada.
      //
      // A diferença: aqui a sessão também guarda o ID token do Firebase, que é
      // o que a API de leads exige no `Authorization: Bearer`
      // (docs/CRM_FASE3_API.md). O token vivo vem sempre do
      // `auth.currentUser.getIdToken()`, que renova sozinho; o guardado é
      // fallback para o intervalo em que o Firebase ainda não restaurou a
      // sessão dele — se ele tiver expirado, a API devolve 401 e a tela volta
      // para o login, que é o comportamento certo.
      const AuthController = (function () {
        function _mostrarErro(mensagem) {
          const el = document.getElementById('login-error');
          el.textContent = mensagem;
          el.style.display = 'block';
        }

        function _travarBotao(travado) {
          const btn = document.getElementById('btn-google-login');
          if (btn) btn.disabled = travado;
        }

        function _mostrarLogin() {
          document.getElementById('login-version-badge').textContent =
            'v' + BGL_CONST.APP_VERSION + ' · ' + BGL_CONST.APP_DATE;
          document.getElementById('login-screen').style.display = 'flex';
          document.getElementById('crm-app').style.display = 'none';
          if (BrowserEnv.isInAppBrowser()) _mostrarAvisoWebview();
        }

        function _mostrarApp(sessao) {
          document.getElementById('user-email').textContent = sessao.email;
          document.getElementById('app-version-badge').textContent =
            'v' + BGL_CONST.APP_VERSION + ' · ' + BGL_CONST.APP_DATE;
          const isHml = BGL_CONFIG.env === 'hml';
          const badgeEnv = document.getElementById('env-badge');
          badgeEnv.textContent = isHml ? 'HML' : 'PROD';
          badgeEnv.className = isHml ? 'hml' : 'prod';
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('crm-app').style.display = 'flex';
          CrmController.iniciar();
        }

        function _mostrarAvisoWebview() {
          const el = document.getElementById('inapp-warning');
          if (!el) return;
          const browser = BrowserEnv.browserRecomendado();
          el.innerHTML =
            '<strong class="inapp-title">Browser interno detectado</strong>' +
            'O login com Google não funciona aqui. Abra esta página no <strong>' +
            esc(browser) +
            '</strong> para continuar.' +
            '<button class="btn-copy-url" id="btn-copiar-url">📋 Copiar link</button>';
          el.style.display = 'block';
          document.getElementById('btn-copiar-url').addEventListener('click', copiarUrl);
          _travarBotao(true);
        }

        function copiarUrl() {
          const url = window.location.href;
          const browser = BrowserEnv.browserRecomendado();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard
              .writeText(url)
              .then(() => _mostrarErro('Link copiado! Cole no ' + browser + ' para abrir.'))
              .catch(() => prompt('Copie este link e abra no ' + browser + ':', url));
          } else {
            prompt('Copie este link e abra no ' + browser + ':', url);
          }
        }

        function login() {
          const fb = window._fb;
          if (!fb) {
            _mostrarErro('Firebase não disponível. Verifique sua conexão e recarregue a página.');
            return;
          }
          _travarBotao(true);
          fb.signInWithPopup(fb.auth, fb.provider)
            .then(async (resultado) => {
              const email = (resultado.user.email || '').toLowerCase();
              if (!AuthSession.isAllowed(email)) {
                fb.signOut(fb.auth).catch(() => {});
                _mostrarErro('Este e-mail não tem permissão de acesso. Contate o responsável.');
                _travarBotao(false);
                return;
              }
              let token = null;
              try {
                token = await resultado.user.getIdToken();
              } catch (e) {
                console.warn('[CRM] Não consegui o ID token no login:', e.message);
              }
              AuthSession.save({ email, name: resultado.user.displayName || email, token });
              _mostrarApp({ email });
            })
            .catch((err) => {
              _travarBotao(false);
              console.error('[CRM Auth] Erro no login:', err.code, err.message, err);
              if (
                err.code !== 'auth/cancelled-by-user' &&
                err.code !== 'auth/popup-closed-by-user'
              ) {
                _mostrarErro(
                  'Erro ao fazer login. Tente novamente. (código: ' +
                    (err.code || err.message) +
                    ')',
                );
              }
            });
        }

        function logout() {
          AuthSession.clear();
          const fb = window._fb;
          if (fb) fb.signOut(fb.auth).catch(() => {});
          _mostrarLogin();
          _travarBotao(false);
        }

        /** Sessão recusada pela API (401): volta ao login explicando por quê. */
        function expirar(mensagem) {
          AuthSession.clear();
          _mostrarLogin();
          _travarBotao(false);
          _mostrarErro(mensagem);
        }

        /** ID token para o `Authorization: Bearer` — ver o comentário do módulo. */
        async function getIdToken() {
          const fb = window._fb;
          if (fb && fb.auth && fb.auth.currentUser) {
            try {
              return await fb.auth.currentUser.getIdToken();
            } catch (e) {
              console.warn('[CRM] Falha ao renovar o ID token:', e.message);
            }
          }
          const sessao = AuthSession.get();
          return (sessao && sessao.token) || null;
        }

        function init() {
          document.getElementById('btn-google-login').addEventListener('click', login);
          document.getElementById('btn-logout').addEventListener('click', logout);
          const sessao = AuthSession.get();
          if (!sessao) {
            _mostrarLogin();
            return;
          }
          // A allowlist é reconferida na ABERTURA, não só no login: quem sai da
          // equipe pode ter uma sessão de 24h ainda válida no browser. A API
          // recusaria de qualquer jeito (403), mas a tela não tem por que
          // desenhar a agenda para depois esvaziar.
          if (!AuthSession.isAllowed(sessao.email)) {
            AuthSession.clear();
            _mostrarLogin();
            _mostrarErro('Este e-mail não tem permissão de acesso. Contate o responsável.');
            return;
          }
          _mostrarApp(sessao);
        }

        return { init, login, logout, expirar, getIdToken, copiarUrl };
      })();

      AuthController.init();
    </script>
  </body>
</html>
