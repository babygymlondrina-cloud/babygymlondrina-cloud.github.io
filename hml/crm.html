<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Gym Londrina — CRM</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paleta — TODA cor do arquivo sai daqui (regra 4 do CLAUDE.md).
         Nenhum hexadecimal solto abaixo deste bloco. */
      :root {
        --purple: #625fb7;
        --purple-dark: #433d99;
        --purple-deep: #130f42;
        --pink: #fd80bd;
        --pink-hot: #fc007c;
        --teal: #66d8d4;
        --teal-dark: #00bfb8;
        --cream: #fff7ee;
        --orange: #ffa233;
        --white: #ffffff;
        --text: #19151f;
        --text-light: #736880;
        --line: #e7e2ee;
        --surface: #ffffff;
        --surface-muted: #f6f3fb;
        --ok: #1b7f5a;
        --ok-bg: #e6f6ef;
        --warn: #92400e;
        --warn-bg: #fffbeb;
        --danger: #c0392b;
        --danger-bg: #fff0f0;
        --neutral: #736880;
        --neutral-bg: #f0edf6;
        --google-border: #dadce0;
        --google-border-hover: #bbbbbb;
        --google-text: #3c4043;
        --overlay: rgba(19, 15, 66, 0.55);
        --tint-purple-strong: rgba(98, 95, 183, 0.18);
        --tint-purple: rgba(98, 95, 183, 0.08);
        --tint-purple-soft: rgba(98, 95, 183, 0.04);
        --tint-white-soft: rgba(255, 255, 255, 0.18);
        --tint-white-faint: rgba(255, 255, 255, 0.45);
        --tint-pink: rgba(252, 0, 124, 0.2);
        --tint-teal: rgba(102, 216, 212, 0.18);
        --shadow: 0 6px 28px rgba(98, 95, 183, 0.13);
        --shadow-sm: 0 2px 12px rgba(98, 95, 183, 0.09);
        --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.22);
        --radius: 20px;
        --radius-sm: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background: var(--cream);
        color: var(--text);
      }
      /* ─── LOGIN ─── */
      #login-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        background:
          radial-gradient(ellipse at 20% 80%, var(--tint-pink) 0%, transparent 52%),
          radial-gradient(ellipse at 85% 10%, var(--tint-teal) 0%, transparent 45%),
          linear-gradient(145deg, var(--purple) 0%, var(--purple-dark) 55%, var(--purple-deep) 100%);
      }
      .login-card {
        background: var(--white);
        border-radius: 28px;
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow-lg);
        text-align: center;
      }
      .login-brand {
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--purple);
        margin-bottom: 0.5rem;
      }
      .login-title {
        font-size: 1.35rem;
        font-weight: 800;
        margin-bottom: 0.6rem;
      }
      .login-desc {
        font-size: 0.88rem;
        color: var(--text-light);
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }
      #login-error {
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        background: var(--danger-bg);
        border: 1px solid var(--danger);
        border-radius: 10px;
        font-size: 0.82rem;
        color: var(--danger);
      }
      #inapp-warning {
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        background: var(--warn-bg);
        border: 1px solid var(--orange);
        border-radius: 10px;
        font-size: 0.82rem;
        color: var(--text);
        text-align: left;
        line-height: 1.5;
      }
      #inapp-warning .inapp-title {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.88rem;
        color: var(--warn);
      }
      .btn-copy-url {
        display: block;
        margin-top: 0.7rem;
        padding: 0.45rem 1rem;
        background: var(--purple);
        border: none;
        border-radius: 20px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--white);
        cursor: pointer;
        width: 100%;
      }
      .btn-google-login {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        background: var(--white);
        border: 1.5px solid var(--google-border);
        border-radius: 24px;
        padding: 0.75rem 1.5rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--google-text);
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }
      .btn-google-login:hover {
        border-color: var(--google-border-hover);
      }
      .btn-google-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .app-version-badge {
        margin-top: 1.2rem;
        font-size: 0.72rem;
        color: var(--text-light);
        opacity: 0.75;
        letter-spacing: 0.02em;
      }
      #login-screen .app-version-badge {
        color: var(--tint-white-faint);
        margin-top: 1.4rem;
      }
      /* ─── APP ─── */
      #crm-app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Cabeçalho fixo: barra do usuário + abas não somem ao rolar a lista —
         só #conteudo rola por baixo. Mesmo padrão de .tab-bar em planos.html. */
      .crm-topo {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--cream);
        box-shadow: var(--shadow-sm);
      }
      .user-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.9rem;
        background: linear-gradient(135deg, var(--tint-purple) 0%, var(--tint-purple-soft) 100%);
        border-bottom: 1px solid var(--line);
      }
      .user-bar-email {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--purple-dark);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 8rem;
      }
      .user-bar .app-version-badge {
        margin-top: 0;
      }
      #env-badge {
        font-weight: 800;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.68rem;
        letter-spacing: 0.03em;
      }
      #env-badge.prod {
        background: var(--neutral-bg);
        color: var(--neutral);
      }
      #env-badge.hml {
        background: var(--orange);
        color: var(--warn);
      }
      .btn-bar {
        background: none;
        border: 1.5px solid var(--purple);
        border-radius: 6px;
        padding: 0.22rem 0.6rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--purple);
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-bar:hover {
        background: var(--purple);
        color: var(--white);
      }
      .tabs {
        display: flex;
        gap: 0.25rem;
        padding: 0.5rem 0.6rem 0;
        background: var(--surface-muted);
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .tab {
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        padding: 0.55rem 0.75rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-light);
        cursor: pointer;
        white-space: nowrap;
      }
      .tab[aria-selected='true'] {
        color: var(--purple-dark);
        border-bottom-color: var(--pink-hot);
      }
      main {
        flex: 1;
        padding: 0.9rem 0.75rem 3rem;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }
      .status-linha {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.76rem;
        color: var(--text-light);
        margin-bottom: 0.7rem;
        min-height: 1.2rem;
      }
      .aviso {
        padding: 0.8rem 1rem;
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        line-height: 1.5;
        margin-bottom: 0.8rem;
      }
      .aviso-erro {
        background: var(--danger-bg);
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      .aviso-info {
        background: var(--warn-bg);
        border: 1px solid var(--orange);
        color: var(--warn);
      }
      .vazio {
        padding: 1.2rem;
        text-align: center;
        color: var(--text-light);
        font-size: 0.85rem;
      }
      /* ─── FAIXAS DO PAINEL DO DIA ─── */
      .faixa {
        margin-bottom: 1rem;
      }
      .faixa-titulo {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-light);
        margin-bottom: 0.4rem;
      }
      .bloco {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        margin-bottom: 0.5rem;
        overflow: hidden;
      }
      .bloco-hora {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.5rem 0.8rem;
        background: var(--surface-muted);
        font-weight: 800;
        font-size: 0.95rem;
      }
      .bloco-hora small {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-light);
        margin-left: auto;
      }
      /* Turma ao lado da hora — uma vez por bloco (cada horário tem uma
         turma só), não repetida na frente de cada bebê. `opacity` em vez de
         uma cor fixa: herda `currentColor` certo tanto no bloco normal
         quanto no destaque de "agora" (fundo pink-hot, texto branco). */
      .bloco-turma {
        font-weight: 600;
        font-size: 0.78rem;
        opacity: 0.75;
      }
      .item {
        padding: 0.6rem 0.8rem;
        border-top: 1px solid var(--line);
      }
      /* Bebê e mãe no MESMO tamanho — só o peso e a cor diferenciam: o bebê
         é quem importa primeiro na conferência, a mãe é contexto. */
      .item-bebe {
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--text);
      }
      .item-mae {
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--text-light);
      }
      .item-sub {
        font-size: 0.8rem;
        color: var(--text-light);
        margin-top: 0.3rem;
      }
      /* AGORA — destaque forte: quem deve chegar neste horário. */
      .faixa-agora .faixa-titulo {
        color: var(--pink-hot);
      }
      .faixa-agora .bloco {
        border: 2px solid var(--pink-hot);
        box-shadow: var(--shadow);
      }
      .faixa-agora .bloco-hora {
        background: var(--pink-hot);
        color: var(--white);
        font-size: 1.1rem;
      }
      .faixa-agora .bloco-hora small {
        color: var(--white);
      }
      .faixa-agora .item-bebe,
      .faixa-agora .item-mae {
        font-size: 1.05rem;
      }
      /* JÁ PASSOU — esmaecido, vira lista de conferência. */
      .faixa-passou .bloco {
        opacity: 0.72;
        background: var(--surface-muted);
      }
      /* AINDA VEM — visível e discreto. */
      .faixa-vem .bloco-hora {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        font-size: 0.88rem;
      }
      .acoes {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        margin-top: 0.5rem;
      }
      .btn-acao {
        display: inline-block;
        border: 1.5px solid var(--teal-dark);
        border-radius: 999px;
        padding: 0.2rem 0.65rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--teal-dark);
        background: none;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-acao:hover {
        background: var(--teal-dark);
        color: var(--white);
      }
      /* Botão de escrita (T6) desabilitado enquanto o PATCH está no ar —
         evita duplo clique. */
      .btn-acao:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-acao:disabled:hover {
        background: none;
        color: var(--teal-dark);
      }
      /* Lugar reservado dos botões de ESCRITA — ligados na T6 (ver comentário
         no JS). Não é botão de propósito: enquanto o write-back da planilha
         (D3) não existir, clique aqui viraria divergência planilha × Firestore. */
      .acao-slot {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        border: 1.5px dashed var(--line);
        border-radius: 999px;
        padding: 0.2rem 0.65rem;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-light);
        white-space: nowrap;
      }
      .acao-slot.marcado {
        border-style: solid;
        border-color: var(--ok);
        background: var(--ok-bg);
        color: var(--ok);
      }
      /* ─── BADGES DE ESTADO ─── */
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 0.1rem 0.5rem;
        font-size: 0.7rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .badge-ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .badge-warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .badge-neutro {
        background: var(--neutral-bg);
        color: var(--neutral);
      }
      /* Selo do dia corrente na Semana (issue #257). Tom da marca, não o verde
         de Confirmado/PE paga: numa tela cheia de selo verde, mais um não
         distinguiria o dia de nada. */
      .badge-hoje {
        background: var(--tint-purple-strong);
        color: var(--purple-dark);
      }
      /* ─── TABELA / LISTA COMPLETA ─── */
      .secao-titulo {
        font-size: 0.95rem;
        font-weight: 800;
        margin: 1.4rem 0 0.5rem;
      }
      .tabela-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.8rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.45rem 0.6rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        background: var(--surface-muted);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-light);
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .dia-titulo {
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--purple-dark);
        margin: 1rem 0 0.4rem;
      }
      .dia-titulo .badge {
        margin-left: 0.4rem;
        vertical-align: middle;
      }
      /* Dia já passado na aba Semana (issue #248): o realce sai do título e o
         fundo da tabela recua. O texto das linhas NÃO perde contraste — o que
         muda é a moldura, porque a lista do passado continua sendo de
         trabalho (contato e acompanhamento de quem já fez a PE). */
      .dia-passado .dia-titulo {
        color: var(--text-light);
      }
      .dia-passado .tabela-wrap {
        background: var(--surface-muted);
      }
      /* `th` já usa `--surface-muted`, e `table`/`td` não têm fundo próprio:
         no grupo recuado o cabeçalho ficaria da mesma cor do corpo e se
         distinguiria só pela tipografia (achado 3 da revisão da PR #256). */
      .dia-passado th {
        background: var(--neutral-bg);
      }
      /* ─── ABA MÊS ─── */
      .mes-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        margin-bottom: 0.7rem;
      }
      .mes-nav strong {
        font-size: 1rem;
        color: var(--purple-dark);
        min-width: 9rem;
        text-align: center;
      }
      .mes-filtros {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-bottom: 0.6rem;
      }
      .chip-filtro {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.76rem;
        font-weight: 700;
        color: var(--text-light);
        background: var(--surface);
        cursor: pointer;
      }
      .chip-filtro span {
        font-size: 0.68rem;
        font-weight: 800;
        color: inherit;
        opacity: 0.8;
      }
      .chip-filtro.ativo {
        border-color: var(--pink-hot);
        background: var(--tint-pink);
        color: var(--pink-hot);
      }
      /* ─── BUSCA ─── */
      .busca-form {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.8rem;
      }
      .busca-form input {
        flex: 1;
        border: 1.5px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 0.6rem 0.8rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.9rem;
        color: var(--text);
        background: var(--surface);
      }
      .btn-primario {
        border: none;
        border-radius: var(--radius-sm);
        background: var(--purple);
        color: var(--white);
        font-family: 'Outfit', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        padding: 0.6rem 1rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-primario:hover {
        background: var(--purple-dark);
      }
      .busca-lista {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .busca-item {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 0.6rem 0.8rem;
        font-family: 'Outfit', sans-serif;
        cursor: pointer;
      }
      .busca-item:hover {
        border-color: var(--purple);
        background: var(--surface-muted);
      }
      .busca-item-nome {
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--text);
      }
      .busca-item-sub {
        font-size: 0.8rem;
        color: var(--text-light);
        margin-top: 0.2rem;
      }
      .busca-item-tel {
        font-size: 0.78rem;
        color: var(--text-light);
        margin-top: 0.2rem;
      }
      /* ─── MODAL (padrão do cfg-modal do proposta.html) ─── */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 50;
      }
      .modal-card {
        background: var(--surface);
        border-radius: var(--radius);
        width: 100%;
        max-width: 560px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.8rem 1rem;
        background: var(--purple);
        color: var(--white);
      }
      .modal-header h2 {
        font-size: 1rem;
        font-weight: 800;
      }
      .modal-close {
        background: none;
        border: none;
        color: var(--white);
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
        padding: 0 0.2rem;
      }
      .modal-body {
        padding: 1rem;
        overflow-y: auto;
      }
      .campo {
        display: flex;
        gap: 0.4rem;
        font-size: 0.82rem;
        padding: 0.25rem 0;
        border-bottom: 1px solid var(--line);
      }
      .campo dt {
        color: var(--text-light);
        min-width: 8.5rem;
        flex-shrink: 0;
      }
      .campo dd {
        font-weight: 600;
        word-break: break-word;
      }
      .bebe-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 0.6rem 0.8rem;
        margin-bottom: 0.5rem;
        background: var(--surface-muted);
      }
      .bebe-nome {
        font-weight: 800;
        font-size: 0.92rem;
        margin-bottom: 0.2rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
    </style>
    <!-- Configuração comum a todas as páginas do projeto (env, allowlist, Firebase) -->
    <script src="config.js"></script>
    <!-- URLs da API de leads — arquivo carregado SÓ por esta página (Fase 3, T3) -->
    <script src="crm-config.js"></script>
    <script src="constants.js"></script>
    <script src="shared.js"></script>
    <script>
      // Detecta HML pelo URL — mesmo critério do planos.html/proposta.html, e é

    <script type="module">
      // Bootstrap do Firebase Auth por módulo ESM do CDN — mesmo padrão do
      // proposta.html. Esta tela NÃO usa Firestore: o dado dela vem todo da API
      // de leads, e o Firebase entra só para autenticar e emitir o ID token que
      // vai no `Authorization: Bearer` (docs/CRM_FASE3_API.md).
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js';
      import {
        getAuth,
        signInWithPopup,
        GoogleAuthProvider,
        signOut,
      } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';

      if (!window.BGL_SKIP_FIREBASE) {
        const app = initializeApp(BGL_CONFIG.firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        window._fb = { auth, provider, signInWithPopup, signOut };
      }
    </script>
  </head>

    <script>
      // ═══════════════════════════════════════════════════════════════════════
      // CRM BGL — tela da equipe (Fase 3, T4 + T6).
      //
      // Contratos: docs/CRM_FASE3_PLANO.md (D8 = o Painel do Dia, §3.3 = o que
      // esta tela consome, §3.4 = como ela é organizada por dentro) e
      // docs/CRM_FASE3_API.md (auth, CORS, view=agenda, write-back).
      //
      // ESCRITA (T6): quatro ações — Compareceu, Fechou, Cancelar, Travar
      // recuperação — atrás de `BGL_CONST.CRM.FLAG_ACOES_ESCRITA`
      // (constants.js). Nasceu DESLIGADA (PR #229) até o write-back na
      // planilha ser validado ao vivo pela apiHml; ligada desde 2026-09-16
      // para a semana paralela em HML (docs/CRM_FASE3_ADOCAO.md). Com ela
      // desligada, esta tela continua byte a byte a somente-leitura da T4:
      // `AcoesController` não desenha nenhum botão e `ApiClient.patch` nunca
      // é chamado — é o rollback de 1 minuto (docs/CRM_FASE3_PLANO.md,
      // decisão D4/T6). "Reagendar" fica fora de propósito (decisão D5): é o
      // único botão que CRIARIA um agendamento, e não está nesta lista.
      // ═══════════════════════════════════════════════════════════════════════

      const ABA = BGL_CONST.CRM.ABA;
      const FAIXA = BGL_CONST.CRM.FAIXA;
      const VIEW = BGL_CONST.CRM.VIEW;

      // ─── Helpers de apresentação ─────────────────────────────────────────
      // Todo texto renderizado abaixo vem da API (nome digitado pela equipe na
      // planilha, nome de perfil do WhatsApp) — escapar não é opcional.
      const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function esc(valor) {
        return String(valor == null ? '' : valor).replace(/[&<>"']/g, (c) => ESCAPES[c]);
      }

      /** Valor legível, ou travessão quando a API devolveu `null`. */
      function ou(valor, vazio) {
        const v = valor == null || valor === '' ? null : valor;
        return v === null ? vazio || '—' : v;
      }

      /**
       * Emoji do sexo do bebê, ou string vazia quando o valor não é
       * reconhecível — mesma regra do `startsWith('m')` que
       * `LinkBuilder.proposta()` usa para o `&sexo=`. Usado no card de
       * detalhe (`bebe.sexo`, do doc completo) e nos itens do Painel do Dia
       * (`item.sexo`, resolvido pela própria `view=agenda` — casando
       * `agendamento.bebe` com `lead.bebes[].nome` do lado do servidor, sem
       * exigir uma busca extra por agendamento; `functions/views-agenda.js`).
       */
      function emojiSexo(sexo) {
        const s = String(sexo || '')
          .trim()
          .toLowerCase();
        if (!s) return '';
        return s.startsWith('m') ? '👦' : s.startsWith('f') ? '👧' : '';
      }

      const DIAS_SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

      /** `YYYY-MM-DD` → `seg 25/08`. Meio-dia UTC evita virada de fuso. */
      function dataCurta(iso) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return ou(iso);
        const d = new Date(iso + 'T12:00:00Z');
        return DIAS_SEMANA[d.getUTCDay()] + ' ' + iso.slice(8, 10) + '/' + iso.slice(5, 7);
      }

      /**
       * `YYYY-MM-DD` → `21/09/2026`, com hora opcional → `21/09/2026 20:00`.
       *
       * Distinto do `dataCurta`, que serve às listas de agenda: lá o ano é sempre o
       * corrente e o dia da semana importa mais. Aqui é histórico — duas propostas
       * do mesmo dia (regerar link é o caso comum) e de anos diferentes precisam
       * ficar distinguíveis, senão a coluna não responde qual link é o vigente.
       */
      function dataHoraBr(iso, hora) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return ou(iso);
        const data = iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4);
        return /^\d{2}:\d{2}$/.test(String(hora || '')) ? data + ' ' + hora : data;
      }

      /**
       * `true` só para URL http(s). O `esc()` escapa `&<>"'` e deixa `javascript:`
       * passar inteiro, então escapar não basta para um valor que vai virar `href`.
       * O `linkUrl` vem da coleção `propostas` — escrita restrita pelo
       * `firestore.rules` a três e-mails —, mas este é um caminho de dado NOVO
       * (API → `href`) e conferir o esquema custa uma linha.
       */
      function linkSeguro(url) {
        return /^https?:\/\//i.test(String(url || ''));
      }

      /** Só os dígitos — é o que o `wa.me` aceita. */
      function soDigitos(telefone) {
        return String(telefone || '').replace(/\D/g, '');
      }

      // ─── Relogio ─────────────────────────────────────────────────────────
      // O relógio da tela é LOCAL, em America/Sao_Paulo (BGL_CONST.TZ), e NUNCA
      // chama a API: as faixas do Painel do Dia recalculam do relógio do
      // browser a cada tique (decisão D8, item b). Só os DADOS precisam de
      // refetch, e disso cuida o `Atualizador`.
      const Relogio = (function () {
        function _partes(opcoes) {
          const fmt = new Intl.DateTimeFormat('pt-BR', { timeZone: BGL_CONST.TZ, ...opcoes });
          const partes = {};
          fmt.formatToParts(new Date()).forEach((p) => {
            partes[p.type] = p.value;
          });
          return partes;
        }

        /** Hoje em `YYYY-MM-DD`, na timezone da unidade. */
        function hojeISO() {
          const p = _partes({ year: 'numeric', month: '2-digit', day: '2-digit' });
          return p.year + '-' + p.month + '-' + p.day;
        }

        /** Hora de parede `HH:mm`, na timezone da unidade. */
        function horaAgora() {
          const p = _partes({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
          return p.hour + ':' + p.minute;
        }

        /** Hora cheia corrente (0–23) — é ela que decide a faixa. */
        function horaCorrente() {
          return Number(horaAgora().slice(0, 2));
        }

        /** `YYYY-MM-DD` + n dias, sem depender do fuso do browser. */
        function somaDias(iso, dias) {
          const [a, m, d] = iso.split('-').map(Number);
          const t = new Date(Date.UTC(a, m - 1, d + dias));
          return (
            t.getUTCFullYear() +
            '-' +
            String(t.getUTCMonth() + 1).padStart(2, '0') +
            '-' +
            String(t.getUTCDate()).padStart(2, '0')
          );
        }

        /**
         * Em que faixa do Painel do Dia cai o bloco das `HH:mm`.
         * Comparação por HORA CHEIA, que é como a agenda da unidade funciona:
         * às 13:59 o bloco das 14h ainda é `VEM`; às 14:00 vira `AGORA`; às
         * 15:00 vira `PASSOU`.
         */
        function faixaDaHora(hora) {
          const h = Number(String(hora || '').slice(0, 2));
          if (!Number.isFinite(h)) return null;
          const agora = horaCorrente();
          if (h < agora) return FAIXA.PASSOU;
          if (h === agora) return FAIXA.AGORA;
          return FAIXA.VEM;
        }

        /** Mês corrente em `YYYY-MM`, na timezone da unidade. */
        function mesAtual() {
          return hojeISO().slice(0, 7);
        }

        /** `YYYY-MM` + n meses (n pode ser negativo). */
        function mesSoma(anoMes, n) {
          const [a, m] = anoMes.split('-').map(Number);
          const t = new Date(Date.UTC(a, m - 1 + n, 1));
          return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0');
        }

        /** `{ de, ate }` do mês inteiro (`YYYY-MM`), primeiro ao último dia. */
        function janelaDoMes(anoMes) {
          const [a, m] = anoMes.split('-').map(Number);
          const de = anoMes + '-01';
          // Dia 0 do mês seguinte = último dia deste mês.
          const ultimo = new Date(Date.UTC(a, m, 0));
          const ate = anoMes + '-' + String(ultimo.getUTCDate()).padStart(2, '0');
          return { de, ate };
        }

        return {
          hojeISO,
          horaAgora,
          horaCorrente,
          somaDias,
          faixaDaHora,
          mesAtual,
          mesSoma,
          janelaDoMes,
        };
      })();

      // ─── CrmState ────────────────────────────────────────────────────────
      // Singleton com accessors por namespace, mesmo padrão do `AppState`
      // (planos.html). Nada em `window.*` — regra 3 do CLAUDE.md.
      const CrmState = (function () {
        let _aba = ABA.PAINEL;
        let _carregando = false;
        let _erro = null;
        let _atualizadoEm = null;
        // Aviso de efeito colateral falho (T6): distinto de `_erro` — a ação
        // FOI salva, só a planilha não recebeu (espelho) ou a mensagem no
        // WhatsApp não saiu (#269). Só o `AcoesController` escreve aqui.
        let _avisoAcao = null;
        // Resposta crua da API por aba; `null` = ainda não carregada.
        const _dados = {
          [ABA.PAINEL]: null,
          [ABA.SEMANA]: null,
          [ABA.MES]: null,
          [ABA.FRIOS]: null,
        };
        // Mês navegado na aba Mês (`YYYY-MM`); `null` = ainda não visitada,
        // resolve para o mês corrente na primeira leitura (`CrmController`).
        let _mesReferencia = null;
        // Filtros de estado ATIVOS na aba Mês — client-side, sobre os itens já
        // carregados (não refaz a chamada). Combináveis: com mais de um
        // ativo, o item só entra se casar com TODOS (AND), não com qualquer
        // um — "compareceu" + "confirmado" mostra quem fez as duas coisas.
        // Vazio = sem filtro, mostra tudo.
        const _mesFiltros = new Set();
        let _leadDoc = null;
        let _leadErro = null;
        let _leadCarregando = false;
        let _buscaFeita = false;
        // Propostas do lead aberto (issue #296). Estado SEPARADO do `_leadDoc`
        // porque a busca é outra, e pode falhar sozinha: o detalhe do lead abre
        // do mesmo jeito com a lista de propostas indisponível.
        let _leadPropostas = null;
        let _leadPropostasErro = null;
        // Busca única (issue #227) — distinto de `lead` (o modal de detalhe,
        // aberto a partir de um resultado). `_buscaResultados === null` é
        // "ainda não buscou"; `[]` é "buscou e não achou nada" — os dois
        // precisam de textos diferentes.
        let _buscaQuery = '';
        let _buscaResultados = null;
        let _buscaCarregando = false;
        let _buscaErro = null;

        return {
          ui: {
            getAba: () => _aba,
            setAba: (v) => {
              _aba = v;
            },
            isCarregando: () => _carregando,
            setCarregando: (v) => {
              _carregando = v;
            },
            getErro: () => _erro,
            setErro: (v) => {
              _erro = v;
            },
            getAtualizadoEm: () => _atualizadoEm,
            setAtualizadoEm: (v) => {
              _atualizadoEm = v;
            },
            getAvisoAcao: () => _avisoAcao,
            setAvisoAcao: (v) => {
              _avisoAcao = v;
            },
            getMesReferencia: () => _mesReferencia,
            setMesReferencia: (v) => {
              _mesReferencia = v;
            },
            getMesFiltros: () => _mesFiltros,
            toggleMesFiltro: (id) => {
              if (_mesFiltros.has(id)) _mesFiltros.delete(id);
              else _mesFiltros.add(id);
            },
          },
          dados: {
            get: (aba) => _dados[aba] || null,
            set: (aba, v) => {
              _dados[aba] = v;
            },
          },
          lead: {
            getDoc: () => _leadDoc,
            getErro: () => _leadErro,
            isCarregando: () => _leadCarregando,
            isBuscaFeita: () => _buscaFeita,
            getPropostas: () => _leadPropostas,
            getPropostasErro: () => _leadPropostasErro,
            setPropostas: ({ itens, erro }) => {
              _leadPropostas = itens || null;
              _leadPropostasErro = erro || null;
            },
            set: ({ doc, erro, carregando }) => {
              _leadDoc = doc || null;
              _leadErro = erro || null;
              _leadCarregando = !!carregando;
              _buscaFeita = true;
              // Abrir OUTRO lead não pode herdar as propostas do anterior.
              _leadPropostas = null;
              _leadPropostasErro = null;
            },
            limpar: () => {
              _leadDoc = null;
              _leadErro = null;
              _leadCarregando = false;
              _buscaFeita = false;
              _leadPropostas = null;
              _leadPropostasErro = null;
            },
          },
          busca: {
            getQuery: () => _buscaQuery,
            setQuery: (v) => {
              _buscaQuery = v;
            },
            getResultados: () => _buscaResultados,
            setResultados: (v) => {
              _buscaResultados = v;
            },
            isCarregando: () => _buscaCarregando,
            setCarregando: (v) => {
              _buscaCarregando = v;
            },
            getErro: () => _buscaErro,
            setErro: (v) => {
              _buscaErro = v;
            },
          },
        };
      })();

      // ─── ApiClient ───────────────────────────────────────────────────────
      // ÚNICO ponto do arquivo que fala com a rede (§3.4 do plano). Injeta o
      // `Authorization: Bearer`, e traduz 401/403/5xx/falha de rede em mensagem
      // que a recepção entende — a tela nunca fica em branco.
      //
      // `get` (T4) e `patch` (T6) — os únicos dois métodos HTTP que a API de
      // leads aceita da tela. Compartilham `_request`: nada de fetch fora
      // daqui, nem espalhado pelos renderers ou pelo `AcoesController`.
      const ApiClient = (function () {
        function _erro(mensagem, extras) {
          return Object.assign(new Error(mensagem), { amigavel: true }, extras || {});
        }

        async function _request(metodo, caminho, { params, body } = {}) {
          // `apiBaseUrl()` (shared.js) escolhe prod/hml, normaliza a barra final
          // e ESTOURA quando a URL do ambiente está vazia (a `hml` nasce assim,
          // até o primeiro deploy da `apiHml`). Erro de configuração, não de
          // rede — vira mensagem própria, para não parecer API fora do ar.
          let base;
          try {
            base = apiBaseUrl();
          } catch (e) {
            console.error('[CRM] Configuração da API ausente:', e.message);
            throw _erro(
              'A URL da API do CRM não está configurada para este ambiente. ' +
                'Avise o Michel — falta preencher o crm-config.js.',
              { configuracao: true },
            );
          }

          const url = new URL(base + caminho);
          Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));

          const token = await AuthController.getIdToken();
          if (!token) {
            throw _erro('Sua sessão expirou. Entre de novo com o Google.', {
              sessaoExpirada: true,
            });
          }

          const headers = { Authorization: 'Bearer ' + token };
          const init = { method: metodo, headers };
          if (body !== undefined) {
            headers['Content-Type'] = 'application/json; charset=utf-8';
            init.body = JSON.stringify(body);
          }

          let res;
          try {
            res = await fetch(url.toString(), init);
          } catch (e) {
            console.warn('[CRM] Falha de rede:', e.message);
            throw _erro('Sem conexão com a API do CRM. Confira a internet e tente de novo.');
          }

          if (res.status === 401) {
            throw _erro('Sua sessão expirou. Entre de novo com o Google.', {
              sessaoExpirada: true,
            });
          }
          if (res.status === 403) {
            throw _erro('Seu e-mail não tem acesso à API do CRM. Peça para o Michel liberar.', {
              semAcesso: true,
            });
          }
          if (res.status === 404) {
            throw _erro('Não encontrado.', { naoEncontrado: true });
          }
          if (res.status >= 500) {
            throw _erro('A API do CRM está fora do ar. Tente de novo em alguns minutos.');
          }

          let corpo;
          try {
            corpo = await res.json();
          } catch {
            throw _erro('A API do CRM respondeu num formato inesperado.');
          }
          if (!res.ok) {
            throw _erro(
              'A API recusou a requisição: ' + ou(corpo && corpo.erro, 'motivo não informado'),
            );
          }
          return corpo;
        }

        function get(caminho, params) {
          return _request('GET', caminho, { params });
        }

        /** `PATCH /leads/{id}` — os eventos de escrita da T6. */
        function patch(caminho, body) {
          return _request('PATCH', caminho, { body });
        }

        return { get, patch };
      })();

      // ─── AcoesController ─────────────────────────────────────────────────
      // Fase 3, T6. Clique → PATCH pelo ApiClient → atualização otimista da UI
      // → rollback visual + mensagem em caso de erro. Nenhum `fetch` aqui —
      // só `ApiClient.patch`.
      //
      // Os quatro eventos (docs/CRM_FASE3_PLANO.md, D3): Compareceu e Fechou só
      // avançam (não existe evento para "desmarcar"), Cancelar tira o
      // agendamento da agenda (o servidor filtra `cancelado` do `view=agenda`)
      // e pede confirmação por ser difícil de desfazer, Travar/destravar
      // recuperação alterna — os três primeiros são reversíveis e de alta
      // frequência, sem confirmação. REAGENDAR NÃO ENTRA (decisão D5): é o
      // único botão que CRIARIA agendamento — não tem lugar aqui.
      const AcoesController = (function () {
        const EVENTO = BGL_CONST.CRM.EVENTO;
        // Chave por AÇÃO (não por evento): travar/destravar são a MESMA ação
        // de um único botão, e travar a checagem de "já tem um PATCH no ar"
        // pelo evento deixaria um duplo clique escapar bem no instante em que
        // a mutação otimista já trocou a direção do próximo clique.
        const _pendentes = new Set();

        function _chave(acao, id, bebe) {
          return acao + '|' + id + '|' + (bebe || '');
        }

        /** Usado pelos renderers para desabilitar o botão enquanto o PATCH está no ar. */
        function estaPendente(acao, id, bebe) {
          return _pendentes.has(_chave(acao, id, bebe));
        }

        /**
         * Item de agenda (Painel, Semana ou Mês) pelo par id+bebe — só na aba
         * ATIVA: um mesmo agendamento de hoje pode estar em mais de uma cache
         * (Painel é sempre hoje, Semana inclui hoje, Mês inclui o mês todo),
         * e mutar a cópia errada deixaria a tela visível sem se atualizar.
         */
        function _itemAgenda(id, bebe) {
          const dados = CrmState.dados.get(CrmState.ui.getAba());
          const itens = (dados && dados.itens) || [];
          const item = itens.find((i) => i.id === id && (i.bebe || '') === (bebe || ''));
          return item ? { itens, item } : null;
        }

        function _itemFrio(id) {
          const dados = CrmState.dados.get(ABA.FRIOS);
          const itens = (dados && dados.itens) || [];
          const item = itens.find((i) => i.id === id);
          return item ? { itens, item } : null;
        }

        function _mensagemErro(e) {
          return e.amigavel ? e.message : 'Não consegui salvar essa ação. Tente de novo.';
        }

        /**
         * `aplicarOtimista`/`reverter` mutam o item já carregado em `CrmState`
         * — o mesmo objeto que os renderers leem — e cada mutação é seguida de
         * `UIRenderer.render()`, então a tela reflete a intenção antes da
         * resposta chegar.
         */
        async function _executar({ acao, evento, id, bebe, aplicarOtimista, reverter }) {
          const chave = _chave(acao, id, bebe);
          if (_pendentes.has(chave)) return; // duplo clique: um PATCH só.
          _pendentes.add(chave);
          aplicarOtimista();
          UIRenderer.render();
          try {
            const resposta = await ApiClient.patch('/leads/' + encodeURIComponent(id), {
              evento,
              bebe,
            });
            // Os campos `espelho` e `whatsapp` só existem quando houve
            // TENTATIVA (docs/CRM_FASE3_API.md). Sem eles: flag da API
            // desligada ou evento fora do mapa — normal, não é erro, não vira
            // aviso. Os dois podem falhar no mesmo clique (a planilha não
            // recebeu E a mensagem não saiu), e aí a equipe precisa saber das
            // duas coisas: o aviso é a junção, não o primeiro que falhou.
            if (resposta && (resposta.espelho || resposta.whatsapp)) {
              const avisos = [];
              if (resposta.espelho && !resposta.espelho.ok) {
                avisos.push(
                  'Isso foi salvo no CRM, mas não atualizou a planilha automaticamente. ' +
                    'Confira a planilha para esta ação.',
                );
              }
              if (resposta.whatsapp && !resposta.whatsapp.ok) {
                avisos.push(
                  'A mensagem automática no WhatsApp não saiu. ' +
                    'Se for o caso, fale com a família por lá.',
                );
              }
              CrmState.ui.setAvisoAcao(avisos.length ? avisos.join(' ') : null);
            }
          } catch (e) {
            reverter();
            // Uma ação que falha de ponta a ponta não tem espelho nenhum para
            // reportar — e um aviso de espelho de uma ação ANTERIOR, ainda na
            // tela, ficaria lido como se fosse desta aqui. Limpa para não
            // misturar os dois problemas (achado da revisão da PR #229).
            CrmState.ui.setAvisoAcao(null);
            if (e.sessaoExpirada) {
              AuthController.expirar(e.message);
            } else {
              CrmState.ui.setErro({ mensagem: _mensagemErro(e) });
              if (!e.amigavel) console.error('[CRM]', e);
            }
          } finally {
            _pendentes.delete(chave);
            UIRenderer.render();
          }
        }

        function marcarCompareceu(item) {
          const antes = item.compareceu;
          _executar({
            acao: 'compareceu',
            evento: EVENTO.COMPARECEU,
            id: item.id,
            bebe: item.bebe,
            aplicarOtimista: () => {
              item.compareceu = true;
            },
            reverter: () => {
              item.compareceu = antes;
            },
          });
        }

        function marcarFechou(item) {
          const antes = item.fechou;
          _executar({
            acao: 'fechou',
            evento: EVENTO.FECHOU,
            id: item.id,
            bebe: item.bebe,
            aplicarOtimista: () => {
              item.fechou = true;
            },
            reverter: () => {
              item.fechou = antes;
            },
          });
        }

        /** Cancelar é a única ação difícil de desfazer — pede confirmação. */
        function cancelar(item) {
          const confirmado = window.confirm(
            'Cancelar o agendamento de ' + (item.bebe || 'este bebê') + '? Ele sai da agenda.',
          );
          if (!confirmado) return;
          const local = _itemAgenda(item.id, item.bebe);
          if (!local) return;
          const indice = local.itens.indexOf(item);
          _executar({
            acao: 'cancelado',
            evento: EVENTO.CANCELADO,
            id: item.id,
            bebe: item.bebe,
            aplicarOtimista: () => {
              if (indice > -1) local.itens.splice(indice, 1);
            },
            reverter: () => {
              if (indice > -1) local.itens.splice(indice, 0, item);
            },
          });
        }

        /** Alterna travar/destravar — mesmo botão, evento conforme o estado atual. */
        function travar(item) {
          const antes = !!item.travado;
          _executar({
            acao: 'recuperacao',
            evento: antes ? EVENTO.DESTRAVAR_RECUPERACAO : EVENTO.TRAVAR_RECUPERACAO,
            id: item.id,
            aplicarOtimista: () => {
              item.travado = !antes;
            },
            reverter: () => {
              item.travado = antes;
            },
          });
        }

        /** Delegado a partir de `[data-acao]` — ver `CrmController.iniciar`. */
        function aoClicar(botao) {
          const acao = botao.dataset.acao;
          const id = botao.dataset.id;
          const bebe = botao.dataset.bebe || '';
          if (acao === 'compareceu' || acao === 'fechou' || acao === 'cancelado') {
            const local = _itemAgenda(id, bebe);
            if (!local) return;
            if (acao === 'compareceu') marcarCompareceu(local.item);
            else if (acao === 'fechou') marcarFechou(local.item);
            else cancelar(local.item);
          } else if (acao === 'recuperacao') {
            const local = _itemFrio(id);
            if (local) travar(local.item);
          }
        }

        return { estaPendente, aoClicar };
      })();

      // ─── LinkBuilder ─────────────────────────────────────────────────────
      // Os dois links que a tela produz. Ambos são LEITURA: abrem outra página,
      // não mudam nada no CRM.
      const LinkBuilder = (function () {
        /**
         * `proposta.html?mae=…&filho=…&sexo=…&turma=…&pe=…` — os mesmos cinco
         * parâmetros da fórmula `sheets/proposta-autofill.gs`, que este botão
         * aposenta (mapa da §2 do plano). O caminho é relativo ao da página
         * atual, então em `/hml/` o link continua apontando para o `/hml/`.
         */
        function proposta({ mae, filho, sexo, turma, pePaga, telefone, leadId }) {
          const p = new URLSearchParams();
          if (mae) p.set('mae', mae);
          if (filho) p.set('filho', filho);
          if (telefone) p.set('telefone', telefone);
          // `lead` é o ELO declarado entre a proposta e o lead (issue #296), e
          // vai separado do `telefone` de propósito: telefone é chave de
          // junção, que quebra quando a família troca de número; o docId não.
          // É o mesmo `resposta.id` que o modal já usa — telefone OU chatID.
          if (leadId) p.set('lead', leadId);
          const s = String(sexo || '')
            .trim()
            .toLowerCase();
          // Mesma regra do REGEXMATCH da fórmula: começa com "m" é menino.
          if (s) p.set('sexo', s.startsWith('m') ? 'm' : 'f');
          const t = String(turma || '')
            .trim()
            .toLowerCase();
          // Turma desconhecida sai do link sem o parâmetro — mesmo efeito do
          // IFS da fórmula, que também não casava e deixava o campo vazio.
          if (BGL_CONST.TURMAS.includes(t)) p.set('turma', t);
          p.set('pe', pePaga ? '1' : '0');
          return window.location.pathname.replace(/[^/]*$/, 'proposta.html') + '?' + p.toString();
        }

        /** Conversa no WhatsApp a partir do telefone do lead. */
        function conversa(telefone) {
          const digitos = soDigitos(telefone);
          return digitos ? 'https://wa.me/' + digitos : null;
        }

        return { proposta, conversa };
      })();

      // ─── Rótulos de estado ───────────────────────────────────────────────
      // `status`, `confirmacao` e `pagamentoPE` chegam CRUS da API, sem
      // interpretação (docs/CRM_FASE3_API.md). A tela só traduz o que conhece;
      // valor novo aparece como veio, em vez de sumir.
      const ROTULO_CONFIRMACAO = {
        [BGL_CONST.CRM.CONFIRMACAO.CONFIRMADO]: 'Confirmado',
        [BGL_CONST.CRM.CONFIRMACAO.PENDENTE]: 'Pendente',
        [BGL_CONST.CRM.CONFIRMACAO.A_CONFIRMAR]: 'A confirmar',
        [BGL_CONST.CRM.CONFIRMACAO.AGUARDANDO_PAGAMENTO]: 'Aguardando pagamento',
      };
      const ROTULO_PE = {
        [BGL_CONST.CRM.PAGAMENTO_PE.PAGO]: 'PE paga',
        [BGL_CONST.CRM.PAGAMENTO_PE.PIX_GERADO]: 'PIX gerado',
      };
      const ROTULO_MOTIVO_FRIO = {
        [BGL_CONST.CRM.MOTIVO_FRIO.FALTA_AGENDAMENTO]: 'Nunca agendou',
        [BGL_CONST.CRM.MOTIVO_FRIO.FALTOU]: 'Faltou na PE',
        [BGL_CONST.CRM.MOTIVO_FRIO.NAO_FECHOU]: 'Não fechou',
      };

      function badge(texto, tom) {
        return '<span class="badge badge-' + tom + '">' + esc(texto) + '</span>';
      }

      function badgeConfirmacao(valor) {
        if (!valor) return badge('Sem confirmação', 'neutro');
        const tom = valor === BGL_CONST.CRM.CONFIRMACAO.CONFIRMADO ? 'ok' : 'warn';
        return badge(ROTULO_CONFIRMACAO[valor] || valor, tom);
      }

      function badgePagamentoPE(valor) {
        if (!valor) return badge('PE não paga', 'neutro');
        const tom = valor === BGL_CONST.CRM.PAGAMENTO_PE.PAGO ? 'ok' : 'warn';
        return badge(ROTULO_PE[valor] || valor, tom);
      }

      /**
       * Botão de escrita (T6) — delegado por `[data-acao]`
       * (`CrmController.iniciar`), que repassa para `AcoesController.aoClicar`.
       * `pendente` desabilita o botão enquanto o PATCH está no ar (evita duplo
       * clique). Usado só atrás de `BGL_CONST.CRM.FLAG_ACOES_ESCRITA`.
       */
      function botaoAcao(acao, rotulo, { id, bebe, pendente }) {
        return (
          '<button type="button" class="btn-acao" data-acao="' +
          esc(acao) +
          '" data-id="' +
          esc(id) +
          '"' +
          (bebe ? ' data-bebe="' + esc(bebe) + '"' : '') +
          (pendente ? ' disabled' : '') +
          '>' +
          esc(rotulo) +
          '</button>'
        );
      }

      // ─── AgendaRenderer ──────────────────────────────────────────────────
      // Sub-renderer compartilhado pelas três abas de agenda (Painel do Dia,
      // Semana e Mês): as três consomem `?view=agenda`, e o item é o mesmo.
      const AgendaRenderer = (function () {
        /** `[{ hora, itens }]` em ordem crescente de hora. */
        function agruparPorHora(itens) {
          const mapa = new Map();
          itens.forEach((i) => {
            if (!mapa.has(i.hora)) mapa.set(i.hora, []);
            mapa.get(i.hora).push(i);
          });
          return Array.from(mapa, ([hora, lista]) => ({ hora, itens: lista })).sort((a, b) =>
            a.hora.localeCompare(b.hora),
          );
        }

        /**
         * Um slot de leitura: mostra o booleano que a API devolve, sem ação
         * nenhuma. É o que a tela desenha com a flag da T6 desligada, e
         * também o que ela mostra quando a ação já foi feita (não existe
         * evento para "desmarcar" `compareceu`/`fechou` — só se marca uma vez).
         */
        function slotT6(rotulo, marcado) {
          return (
            '<span class="acao-slot' +
            (marcado ? ' marcado' : '') +
            '">' +
            (marcado ? '✓ ' : '') +
            esc(rotulo) +
            '</span>'
          );
        }

        /**
         * Presença/Fechou/Cancelar — atrás de `BGL_CONST.CRM.FLAG_ACOES_ESCRITA`
         * (T6, decisão D3 do CRM_FASE3_PLANO.md). Com a flag desligada, o
         * comportamento é byte a byte o da T4 (somente leitura): só os slots.
         *
         * No Painel do Dia ficam nas TRÊS faixas, não só na "já passou": a
         * presença é marcada quando a mãe CHEGA, que é dentro do horário
         * corrente, e a equipe precisa enxergar o estado do agendamento antes
         * mesmo de a hora chegar. Quem muda por faixa é o layout, não o que
         * se pode marcar. `_partesAcoes` devolve o array cru (sem o `<div>`
         * de fora) para `tabela` poder combiná-lo com o botão de Detalhe
         * (issue #244 — Semana e Mês ganham os mesmos botões do Painel).
         *
         * `mostrarAcoesDeEscrita` (default true) existe só para o rodapé do
         * Painel: os itens de hoje já têm o botão na própria faixa, então
         * repeti-lo na linha do rodapé seria um segundo "Marcar presença"
         * clicável para o mesmo bebê na mesma tela (achado da revisão da PR
         * #245, 2ª rodada) — `tabela()` desliga essa parte só para essa
         * chamada, mantendo Detalhe/Conversa.
         */
        function _partesAcoes(item, { proposta, mostrarAcoesDeEscrita = true }) {
          const escritaLigada = mostrarAcoesDeEscrita && BGL_CONST.CRM.FLAG_ACOES_ESCRITA;
          const partes = [];
          if (mostrarAcoesDeEscrita) {
            if (escritaLigada && !item.compareceu) {
              partes.push(
                botaoAcao('compareceu', 'Marcar presença', {
                  id: item.id,
                  bebe: item.bebe,
                  pendente: AcoesController.estaPendente('compareceu', item.id, item.bebe),
                }),
              );
            } else {
              partes.push(slotT6('Presença', item.compareceu));
            }
            if (escritaLigada && !item.fechou) {
              partes.push(
                botaoAcao('fechou', 'Marcar fechou', {
                  id: item.id,
                  bebe: item.bebe,
                  pendente: AcoesController.estaPendente('fechou', item.id, item.bebe),
                }),
              );
            } else {
              partes.push(slotT6('Fechou', item.fechou));
            }
            if (escritaLigada) {
              partes.push(
                botaoAcao('cancelado', 'Cancelar', {
                  id: item.id,
                  bebe: item.bebe,
                  pendente: AcoesController.estaPendente('cancelado', item.id, item.bebe),
                }),
              );
            }
          }
          // O link de proposta, esse sim, só faz sentido depois da PE — fica na
          // faixa de conferência (D8: "enviar a proposta por WhatsApp").
          if (proposta && item.telefone) {
            partes.push(
              '<button type="button" class="btn-acao" data-lead="' +
                esc(item.telefone) +
                '">📄 Proposta</button>',
            );
          }
          const wpp = LinkBuilder.conversa(item.telefone);
          if (wpp) {
            partes.push(
              '<a class="btn-acao" href="' +
                esc(wpp) +
                '" target="_blank" rel="noopener">💬 Conversa</a>',
            );
          }
          return partes;
        }

        function acoes(item, opcoes) {
          return '<div class="acoes">' + _partesAcoes(item, opcoes).join('') + '</div>';
        }

        /** Um agendamento dentro de um bloco de horário. */
        function item(dados, opcoes) {
          return (
            '<div class="item">' +
            '<div class="item-bebe">' +
            (emojiSexo(dados.sexo) ? emojiSexo(dados.sexo) + ' ' : '') +
            esc(ou(dados.bebe, 'bebê não informado')) +
            '</div>' +
            '<div class="item-mae">' +
            esc(ou(dados.nome, 'Sem nome')) +
            '</div>' +
            '<div class="item-sub">' +
            badgeConfirmacao(dados.confirmacao) +
            ' ' +
            badgePagamentoPE(dados.pagamentoPE) +
            '</div>' +
            acoes(dados, opcoes) +
            '</div>'
          );
        }

        /**
         * `bloco-hora` traz a turma ao lado da hora, uma vez só — cada
         * horário tem uma única turma (regra da recepção), então repetir na
         * frente de cada bebê do bloco era ruído. Item da turma vem do
         * primeiro agendamento do grupo, que é o único que existe na prática.
         */
        function bloco(grupo, opcoes) {
          const n = grupo.itens.length;
          const turma = grupo.itens[0] && grupo.itens[0].turma;
          return (
            '<div class="bloco">' +
            '<div class="bloco-hora">' +
            esc(grupo.hora) +
            (turma ? '<span class="bloco-turma">' + esc(turma) + '</span>' : '') +
            '<small>' +
            n +
            (n === 1 ? ' agendamento' : ' agendamentos') +
            '</small></div>' +
            grupo.itens.map((i) => item(i, opcoes)).join('') +
            '</div>'
          );
        }

        /**
         * Tabela com o dia inteiro, estado de confirmação e de pagamento da
         * PE — usada pela aba Semana, pela aba Mês e pela lista completa do
         * rodapé do Painel (`PainelRenderer`): telefone, link de conversa
         * (`LinkBuilder.conversa`), acesso ao detalhe pelo mesmo `data-lead`
         * que o handler delegado já trata, e — na Semana e no Mês — os
         * mesmos botões de escrita (Presença/Fechou/Cancelar) do Painel:
         * `AcoesController._itemAgenda` já resolve o item pela aba ATIVA,
         * então nenhum caminho novo de escrita foi criado aqui, só o botão
         * (issue #244). O rodapé do Painel passa `comAcoesDeEscrita: false`
         * — os itens de hoje já têm o botão na própria faixa, e repeti-lo
         * na linha do rodapé duplicaria o clique na mesma tela (achado da
         * revisão da PR #245, 2ª rodada).
         *
         * `comData` acrescenta a Data como PRIMEIRA coluna — só o Mês pede
         * (issue #249), porque ele é o único que lista o período inteiro numa
         * tabela só. Semana e Painel agrupam por dia antes de chamar aqui, e
         * ali a coluna repetiria em cada linha o que o cabeçalho do grupo já
         * diz.
         */
        function tabela(itens, { comAcoesDeEscrita = true, comData = false } = {}) {
          const linhas = itens
            .map((i) => {
              const acoesCel = _partesAcoes(i, {
                proposta: false,
                mostrarAcoesDeEscrita: comAcoesDeEscrita,
              });
              if (i.telefone) {
                acoesCel.unshift(
                  '<button type="button" class="btn-acao" data-lead="' +
                    esc(i.telefone) +
                    '">📄 Detalhe</button>',
                );
              }
              return (
                '<tr>' +
                (comData ? '<td>' + esc(dataCurta(i.data)) + '</td>' : '') +
                '<td>' +
                esc(ou(i.hora)) +
                '</td>' +
                '<td>' +
                esc(ou(i.bebe)) +
                '</td>' +
                '<td>' +
                esc(ou(i.nome)) +
                '</td>' +
                '<td>' +
                esc(ou(i.turma)) +
                '</td>' +
                '<td>' +
                esc(ou(i.telefone)) +
                '</td>' +
                '<td>' +
                badgeConfirmacao(i.confirmacao) +
                '</td>' +
                '<td>' +
                badgePagamentoPE(i.pagamentoPE) +
                '</td>' +
                '<td><div class="acoes">' +
                acoesCel.join('') +
                '</div></td>' +
                '</tr>'
              );
            })
            .join('');
          return (
            '<div class="tabela-wrap"><table>' +
            '<thead><tr>' +
            (comData ? '<th>Data</th>' : '') +
            '<th>Hora</th><th>Bebê</th><th>Mãe</th><th>Turma</th><th>Telefone</th>' +
            '<th>Confirmação</th><th>PE</th><th></th></tr></thead>' +
            '<tbody>' +
            linhas +
            '</tbody></table></div>'
          );
        }

        return { agruparPorHora, bloco, tabela };
      })();

      // ─── PainelRenderer ──────────────────────────────────────────────────
      // O Painel do Dia (decisão D8): a tela default e a mais usada. Três
      // faixas decididas pelo relógio LOCAL, e embaixo o dia inteiro com
      // confirmação e pagamento da PE por agendamento.
      const PainelRenderer = (function () {
        const FAIXAS = [
          {
            id: FAIXA.AGORA,
            titulo: 'Agora',
            legenda: 'quem deve chegar',
            vazio: 'Ninguém marcado para este horário.',
            proposta: false,
          },
          {
            id: FAIXA.PASSOU,
            titulo: 'Já passou',
            legenda: 'lista de conferência',
            vazio: 'Nada antes deste horário.',
            proposta: true,
          },
          {
            id: FAIXA.VEM,
            titulo: 'Ainda vem',
            legenda: 'mais tarde hoje',
            vazio: 'Nada depois deste horário.',
            proposta: false,
          },
        ];

        function _faixa(def, grupos) {
          const corpo = grupos.length
            ? grupos.map((g) => AgendaRenderer.bloco(g, { proposta: def.proposta })).join('')
            : '<div class="vazio">' + esc(def.vazio) + '</div>';
          return (
            '<section class="faixa faixa-' +
            def.id +
            '" data-faixa="' +
            def.id +
            '">' +
            '<h2 class="faixa-titulo">' +
            esc(def.titulo) +
            ' <span>· ' +
            esc(def.legenda) +
            '</span></h2>' +
            corpo +
            '</section>'
          );
        }

        function render(resposta) {
          const itens = (resposta && resposta.itens) || [];
          if (!itens.length) {
            return '<div class="vazio">Nenhum agendamento para hoje.</div>';
          }
          const comHora = itens.filter((i) => i.hora);
          const semHora = itens.filter((i) => !i.hora);
          const porFaixa = { [FAIXA.PASSOU]: [], [FAIXA.AGORA]: [], [FAIXA.VEM]: [] };
          AgendaRenderer.agruparPorHora(comHora).forEach((g) => {
            const faixa = Relogio.faixaDaHora(g.hora);
            if (faixa) porFaixa[faixa].push(g);
          });

          const avisoSemHora = semHora.length
            ? '<div class="aviso aviso-info" id="aviso-sem-hora">' +
              semHora.length +
              (semHora.length === 1
                ? ' agendamento sem horário na planilha — ele não entra nas faixas, confira na lista abaixo.'
                : ' agendamentos sem horário na planilha — eles não entram nas faixas, confira na lista abaixo.') +
              '</div>'
            : '';

          return (
            FAIXAS.map((def) => _faixa(def, porFaixa[def.id])).join('') +
            avisoSemHora +
            '<h2 class="secao-titulo">Todos os agendamentos de hoje (' +
            itens.length +
            ')</h2>' +
            // Sem os botões de escrita: cada item já tem o dele na própria
            // faixa acima — repetir aqui duplicaria o clique (revisão #245).
            AgendaRenderer.tabela(itens, { comAcoesDeEscrita: false })
          );
        }

        return { render };
      })();

      // ─── SemanaRenderer ──────────────────────────────────────────────────
      // Aba secundária: hoje-7..hoje+7 (issue #244) — os 7 dias pra trás são
      // para CONTATO E ACOMPANHAMENTO de quem já passou pela PE; os 7 pra
      // frente são a mesma janela da mensagem das 18h (mapa da §2 do plano).
      const SemanaRenderer = (function () {
        function render(resposta) {
          const hoje = Relogio.hojeISO();
          const todos = (resposta && resposta.itens) || [];
          // Nos dias PASSADOS, quem já fechou não precisa mais de
          // acompanhamento — some da lista. Hoje e os dias futuros mostram
          // tudo, sem filtro (mesma regra confirmada na issue #244).
          const itens = todos.filter((i) => i.data >= hoje || !i.fechou);
          if (!itens.length) {
            return '<div class="vazio">Nenhum agendamento nos últimos ou próximos 7 dias.</div>';
          }
          const porDia = new Map();
          itens.forEach((i) => {
            if (!porDia.has(i.data)) porDia.set(i.data, []);
            porDia.get(i.data).push(i);
          });
          return Array.from(porDia)
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([data, lista]) => {
              // Hoje conta como "vai vir": a PE do dia ainda não aconteceu na
              // maior parte do dia, e é a mesma fronteira do filtro acima
              // (`i.data >= hoje`) — duas fronteiras diferentes na mesma aba
              // fariam o dia de hoje sumir da lista e aparecer como passado.
              const passado = data < hoje;
              // `data-dia` é o que a âncora da entrada da aba procura
              // (`UIRenderer.ancorarHojeNaSemana`, issue #257): ela precisa do
              // primeiro dia `>= hoje` e o dia de hoje pode não estar
              // renderizado — dia sem agendamento não gera grupo.
              return (
                '<section class="dia-grupo' +
                (passado ? ' dia-passado' : data === hoje ? ' dia-hoje' : '') +
                '" data-dia="' +
                esc(data) +
                '">' +
                '<h2 class="dia-titulo">' +
                esc(dataCurta(data)) +
                ' · ' +
                lista.length +
                (lista.length === 1 ? ' agendamento' : ' agendamentos') +
                (passado ? badge('já passou', 'neutro') : '') +
                (data === hoje ? badge('hoje', 'hoje') : '') +
                '</h2>' +
                AgendaRenderer.tabela(lista) +
                '</section>'
              );
            })
            .join('');
        }
        return { render };
      })();

      // ─── MesRenderer ─────────────────────────────────────────────────────
      // Aba "Mês" (issue #226): os agendados do mês navegado, filtráveis por
      // estado. Filtro e contadores são client-side sobre os itens JÁ
      // carregados — só a troca de mês refaz a chamada (`CrmController`).
      const MesRenderer = (function () {
        const MESES = [
          'janeiro',
          'fevereiro',
          'março',
          'abril',
          'maio',
          'junho',
          'julho',
          'agosto',
          'setembro',
          'outubro',
          'novembro',
          'dezembro',
        ];

        /**
         * Filtros de estado propostos pela issue: compareceu, fechou, PE paga,
         * confirmação — mais "pesquisa enviada" (barato: só o campo enviadaEm,
         * ver `functions/views-agenda.js`). "Respondeu pesquisa" fica de fora
         * de propósito — não existe como dado ainda (ver a issue).
         */
        const FILTROS = [
          { id: 'compareceu', rotulo: 'Compareceu', teste: (i) => i.compareceu },
          { id: 'fechou', rotulo: 'Fechou', teste: (i) => i.fechou },
          {
            id: 'pe-paga',
            rotulo: 'PE paga',
            teste: (i) => i.pagamentoPE === BGL_CONST.CRM.PAGAMENTO_PE.PAGO,
          },
          {
            id: 'confirmado',
            rotulo: 'Confirmado',
            teste: (i) => i.confirmacao === BGL_CONST.CRM.CONFIRMACAO.CONFIRMADO,
          },
          { id: 'pesquisa-enviada', rotulo: 'Pesquisa enviada', teste: (i) => i.pesquisaEnviada },
        ];

        /** `YYYY-MM` → `Setembro de 2026`. */
        function _rotuloMes(anoMes) {
          const [ano, mes] = anoMes.split('-').map(Number);
          const nome = MESES[mes - 1] || anoMes;
          return nome.charAt(0).toUpperCase() + nome.slice(1) + ' de ' + ano;
        }

        function _navegacao(anoMes) {
          return (
            '<div class="mes-nav">' +
            '<button type="button" class="btn-acao" data-mes-nav="anterior" aria-label="Mês anterior">◀</button>' +
            '<strong>' +
            esc(_rotuloMes(anoMes)) +
            '</strong>' +
            '<button type="button" class="btn-acao" data-mes-nav="seguinte" aria-label="Mês seguinte">▶</button>' +
            '</div>'
          );
        }

        /**
         * Contador de cada chip é sobre o TOTAL do mês (não sobre o resultado
         * já filtrado pelos outros chips ativos) — é o que deixa a pessoa ver
         * "quantos fecharam" mesmo depois de já ter marcado "confirmado".
         */
        function _filtros(itens, ativos) {
          return (
            '<div class="mes-filtros">' +
            FILTROS.map((f) => {
              const n = itens.filter(f.teste).length;
              return (
                '<button type="button" class="chip-filtro' +
                (ativos.has(f.id) ? ' ativo' : '') +
                '" data-mes-filtro="' +
                f.id +
                '" aria-pressed="' +
                ativos.has(f.id) +
                '">' +
                esc(f.rotulo) +
                ' <span>' +
                n +
                '</span></button>'
              );
            }).join('') +
            '</div>'
          );
        }

        /** Item passa se casar com TODOS os filtros ativos (AND). Vazio → passa tudo. */
        function _aplicarFiltros(itens, ativos) {
          if (!ativos.size) return itens;
          const testes = FILTROS.filter((f) => ativos.has(f.id)).map((f) => f.teste);
          return itens.filter((i) => testes.every((teste) => teste(i)));
        }

        function render(resposta) {
          const anoMes = CrmState.ui.getMesReferencia() || Relogio.mesAtual();
          const itens = (resposta && resposta.itens) || [];
          const ativos = CrmState.ui.getMesFiltros();
          const filtrados = _aplicarFiltros(itens, ativos);

          const corpo = !itens.length
            ? '<div class="vazio">Nenhum agendamento neste mês.</div>'
            : !filtrados.length
              ? '<div class="vazio">Nenhum agendamento com os filtros marcados.</div>'
              : '<h2 class="secao-titulo">' +
                filtrados.length +
                (filtrados.length === 1 ? ' agendamento' : ' agendamentos') +
                '</h2>' +
                AgendaRenderer.tabela(filtrados, { comData: true });

          return _navegacao(anoMes) + _filtros(itens, ativos) + corpo;
        }

        return { render };
      })();

      // ─── FriosRenderer ───────────────────────────────────────────────────
      // Aba secundária: `?view=frios`, a view da Fase 2 — consumida, não
      // reimplementada (docs/CRM_FASE2_API.md).
      const FriosRenderer = (function () {
        function render(resposta) {
          const itens = (resposta && resposta.itens) || [];
          if (!itens.length) {
            return '<div class="vazio">Nenhum lead na lista de recuperação.</div>';
          }
          const linhas = itens
            .map((i) => {
              const wpp = LinkBuilder.conversa(i.telefone);
              const acoes = [];
              if (i.telefone) {
                acoes.push(
                  '<button type="button" class="btn-acao" data-lead="' +
                    esc(i.telefone) +
                    '">📄 Detalhe</button>',
                );
              }
              // Travar/destravar recuperação (T6) — mesmo botão, evento
              // conforme o estado atual (`AcoesController.travar`). Não tem
              // simetria de regra de negócio (CLAUDE.md: "lead travado é
              // comissão dobrada") — só aciona o evento que já existe.
              if (BGL_CONST.CRM.FLAG_ACOES_ESCRITA) {
                acoes.push(
                  botaoAcao(
                    'recuperacao',
                    i.travado ? 'Destravar recuperação' : 'Travar recuperação',
                    {
                      id: i.id,
                      pendente: AcoesController.estaPendente('recuperacao', i.id),
                    },
                  ),
                );
              }
              if (wpp) {
                acoes.push(
                  '<a class="btn-acao" href="' +
                    esc(wpp) +
                    '" target="_blank" rel="noopener">💬 Conversa</a>',
                );
              }
              return (
                '<tr>' +
                '<td>' +
                esc(ou(i.nome)) +
                '</td>' +
                '<td>' +
                esc(ROTULO_MOTIVO_FRIO[i.motivo] || ou(i.motivo)) +
                '</td>' +
                '<td>' +
                esc(dataCurta(i.data)) +
                '</td>' +
                '<td>' +
                (i.travado ? badge('Travado', 'warn') : '') +
                (i.reengajavel === false ? badge('Sem telefone', 'neutro') : '') +
                '</td>' +
                '<td><div class="acoes">' +
                acoes.join('') +
                '</div></td>' +
                '</tr>'
              );
            })
            .join('');
          return (
            '<h2 class="secao-titulo">Leads a recuperar (' +
            itens.length +
            ')</h2>' +
            '<div class="tabela-wrap"><table>' +
            '<thead><tr><th>Nome</th><th>Motivo</th><th>Data</th><th></th><th></th></tr></thead>' +
            '<tbody>' +
            linhas +
            '</tbody></table></div>'
          );
        }
        return { render };
      })();

      // ─── BuscaRenderer ───────────────────────────────────────────────────
      // Busca única (issue #227): telefone, nome do bebê ou do responsável,
      // com tolerância a erro de digitação e fonética — `?view=busca&q=`
      // (`functions/busca.js`). Cada resultado é uma LISTA, nunca abre direto:
      // busca aproximada acha o lead errado com confiança, e a tela leva a
      // ações (marcar presença, fechou) — o clique é do usuário, com contexto
      // suficiente pra confirmar antes (bebê que casou, turma, telefone).
      const BuscaRenderer = (function () {
        function _item(item) {
          const contexto = [];
          if (item.bebeCasado) contexto.push('👶 ' + esc(item.bebeCasado));
          if (item.turma) contexto.push('🏷️ ' + esc(item.turma));
          return (
            '<button type="button" class="busca-item" data-lead="' +
            esc(item.telefone || item.id) +
            '">' +
            '<div class="busca-item-nome">' +
            esc(ou(item.nome, 'Sem nome')) +
            '</div>' +
            (contexto.length
              ? '<div class="busca-item-sub">' + contexto.join(' · ') + '</div>'
              : '') +
            '<div class="busca-item-tel">' +
            esc(ou(item.telefone)) +
            '</div>' +
            '</button>'
          );
        }

        function _corpo() {
          const erro = CrmState.busca.getErro();
          if (CrmState.busca.isCarregando()) return '<div class="vazio">Procurando…</div>';
          if (erro)
            return '<div class="aviso aviso-erro" id="busca-resultado">' + esc(erro) + '</div>';
          const resultados = CrmState.busca.getResultados();
          if (resultados === null) {
            return '<div class="vazio">Digite o nome do bebê, do responsável ou o telefone.</div>';
          }
          if (!resultados.length) {
            return '<div class="vazio" id="busca-resultado">Nenhum resultado.</div>';
          }
          return '<div class="busca-lista">' + resultados.map(_item).join('') + '</div>';
        }

        function render() {
          return (
            '<form class="busca-form" id="form-busca">' +
            '<label class="sr-only" for="inp-busca">Buscar</label>' +
            '<input id="inp-busca" name="q" type="text" autocomplete="off" value="' +
            esc(CrmState.busca.getQuery()) +
            '" placeholder="Nome do bebê, do responsável ou telefone" />' +
            '<button class="btn-primario" type="submit">Buscar</button>' +
            '</form>' +
            '<p class="status-linha">Aceita erro de digitação e nome parecido — confira o contexto antes de abrir.</p>' +
            _corpo()
          );
        }
        return { render };
      })();

      // ─── LeadDetailRenderer ──────────────────────────────────────────────
      // Detalhe do lead no padrão de modal do proposta.html (`cfg-modal`):
      // bebês, agendamentos e o botão "Gerar proposta" — um por bebê, porque
      // um responsável pode ter dois filhos com turmas e sexos diferentes (a
      // fórmula que este botão aposenta só sabia lidar com um).
      const LeadDetailRenderer = (function () {
        /** Campo de texto BRUTO — sempre escapado. */
        function _campo(rotulo, valor) {
          return _campoHtml(rotulo, esc(valor));
        }

        /**
         * Campo cujo valor já é HTML de confiança (badges montados por
         * `badge()`, que escapa o texto deles por dentro) — não escapa de
         * novo. Achado em uso real: `_campo` decidia por `typeof valor`, e
         * `badge(...) + badge(...)` também é `string`, então a Recuperação
         * saía como `&lt;span&gt;...` na tela em vez do badge renderizado.
         */
        function _campoHtml(rotulo, html) {
          return '<div class="campo"><dt>' + esc(rotulo) + '</dt><dd>' + html + '</dd></div>';
        }

        /** Agendamentos do bebê, do mais recente para o mais antigo. */
        function _agendamentosDo(lead, nomeBebe) {
          const todos = lead.agendamentos || [];
          const doBebe = todos.filter((a) => a.bebe === nomeBebe);
          // Lead com um único bebê pode ter agendamento sem o nome preenchido
          // (linha antiga da planilha) — nesse caso todos são dele.
          const lista = doBebe.length || (lead.bebes || []).length > 1 ? doBebe : todos;
          return lista
            .slice()
            .sort((a, b) =>
              String((b.data || '') + ' ' + (b.hora || '')).localeCompare(
                String((a.data || '') + ' ' + (a.hora || '')),
              ),
            );
        }

        function _bebe(lead, bebe, telefoneFallback) {
